        operation_class: "telemetry"
        policy_version: "woof-api-alert-policy-v1"
        release: "unknown"
      annotations:
        summary: "Woof API operational metrics are missing (warning)"
        description: "The API metrics heartbeat is absent. Missing telemetry is an observability incident, not evidence of health."
    - alert: WoofOperationalMetricsMissingCritical
