        severity: "warning"
        service: "woof-api"
        operation_class: "release_identity"
        policy_version: "woof-api-alert-policy-v1"
      annotations:
        summary: "Woof API is exporting an unknown release identity"
        description: "Operational evidence is not tied to an exact 40-hex Git SHA; do not promote this process as a qualified release."
    - alert: WoofReadinessProbeMissingWarning
      expr: >-
        absent(woof_http_requests_total{service="woof-api",operation="ObservabilityController.readiness"})
