# LOCAL DEVELOPMENT ONLY.
#
# This stack publishes database/Redis/n8n ports and provides intentionally weak
# fallback credentials for a one-machine developer environment. Do not deploy
# this file to production. See DEPLOYMENT_GUIDE.md for production requirements.

services:
  # PostgreSQL with pgvector extension. Keep the major aligned with CI.
  postgres:
    image: pgvector/pgvector:pg15
    container_name: woof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-woof}
      POSTGRES_INITDB_ARGS: '-E UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-woof}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for local caching and queues.
  redis:
    image: redis:7-alpine
    container_name: woof-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Local n8n workflow automation. Override the fallback auth values in .env
  # whenever this port is reachable beyond your own development machine.
  n8n:
    image: n8nio/n8n:latest
    container_name: woof-n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DATABASE:-woof_n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-woofadmin}
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Los_Angeles
      - TZ=America/Los_Angeles
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Woof API (optional for local development; running pnpm directly is also fine).
  # api:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/Dockerfile.api
  #   container_name: woof-api
  #   restart: unless-stopped
  #   ports:
  #     - '4000:4000'
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=4000
  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-woof}
  #     - REDIS_URL=redis://redis:6379
  #     - JWT_SECRET=your-development-jwt-secret
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  default:
    name: woof-network
