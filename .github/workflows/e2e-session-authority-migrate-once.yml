name: E2E Session Authority Migration Once

on:
  push:
    branches:
      - agent/e2e-session-authority-v1
    paths:
      - '.github/workflows/e2e-session-authority-migrate-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/e2e-session-authority-v1
          fetch-depth: 0

      - name: Apply bounded session fixture migration
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def add_import(path: str, import_line: str) -> None:
              file = Path(path)
              text = file.read_text()
              first_newline = text.find('\n')
              if first_newline < 0:
                  raise SystemExit(f'{path}: missing first import boundary')
              if import_line in text:
                  raise SystemExit(f'{path}: session helper import already present unexpectedly')
              file.write_text(text[: first_newline + 1] + import_line + '\n' + text[first_newline + 1 :])

          def replace_region(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one bounded auth region, found {count}')
              file.write_text(updated)

          release = 'apps/web/e2e/release-polish.spec.ts'
          add_import(release, "import { seedAuthenticatedSession } from './support/session';")
          replace_region(
              release,
              r"async function authenticate\(page: Page\) \{.*?\n\}\n\n(?=async function authorizePetToday)",
              """const browserUser = {
            id: 'user-1',
            email: 'owner@example.com',
            handle: 'dog-owner',
            pets: [],
          };

          async function authenticate(page: Page) {
            await seedAuthenticatedSession(page, {
              user: browserUser,
              token: 'browser-test-token',
            });
          }

          """.replace('          ', ''),
          )

          library = 'apps/web/e2e/library-regression.spec.ts'
          add_import(library, "import { seedAuthenticatedSession } from './support/session';")
          replace_region(
              library,
              r"async function authenticate\(page: Page\) \{.*?\n\}\n\n(?=async function routeLibrary)",
              """async function authenticate(page: Page) {
            await seedAuthenticatedSession(page, {
              user,
              token: 'browser-test-token',
            });
          }

          """.replace('          ', ''),
          )

          trust = 'apps/web/e2e/trust-discovery.spec.ts'
          add_import(trust, "import { grantRoughLocation, seedAuthenticatedSession } from './support/session';")
          replace_region(
              trust,
              r"async function authenticate\(page: Page\) \{.*?\n\}\n\n(?=const recommendation)",
              """async function authenticate(page: Page) {
            await grantRoughLocation(page.context(), {
              latitude: 37.7749,
              longitude: -122.4194,
              accuracy: 100,
            });
            await seedAuthenticatedSession(page, {
              user,
              token: 'trust-browser-token',
            });
          }

          """.replace('          ', ''),
          )

          for path in [release, library, trust]:
              text = Path(path).read_text()
              if 'addInitScript' in text:
                  raise SystemExit(f'{path}: addInitScript remains after migration')
              if 'seedAuthenticatedSession' not in text:
                  raise SystemExit(f'{path}: shared session helper missing after migration')

          Path('.github/workflows/e2e-session-authority-migrate-once.yml').unlink()
          PY

      - name: Commit only the bounded migration
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/e2e/release-polish.spec.ts \
            apps/web/e2e/library-regression.spec.ts \
            apps/web/e2e/trust-discovery.spec.ts \
            .github/workflows/e2e-session-authority-migrate-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'test(web): consolidate browser session authority'
          git push origin HEAD:agent/e2e-session-authority-v1
