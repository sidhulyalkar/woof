name: Public Truth README Patch Once

on:
  push:
    branches:
      - agent/public-truth-consistency-v1
    paths:
      - '.github/workflows/public-truth-readme-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/public-truth-consistency-v1
          fetch-depth: 0

      - name: Align README framework badge with qualified runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = 'Next.js-15.3-000000'
          new = 'Next.js-15.5.24-000000'
          if old not in text:
              raise SystemExit('expected stale Next.js README badge not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit README-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: align README with qualified Next runtime'
          git push origin HEAD:agent/public-truth-consistency-v1
