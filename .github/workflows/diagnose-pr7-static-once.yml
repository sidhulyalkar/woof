name: Diagnose PR7 static debt once

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-pr7-static-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @woof/database db:generate

      - name: Capture full static diagnostics
        shell: bash
        run: |
          set +e
          pnpm --filter @woof/web exec eslint src --format json --output-file ../../web-eslint.json
          WEB_LINT=$?
          pnpm --filter @woof/mobile exec eslint . --format json --output-file ../../mobile-eslint.json
          MOBILE_LINT=$?
          pnpm --filter @woof/web type-check > web-tsc.txt 2>&1
          WEB_TSC=$?
          pnpm --filter @woof/mobile type-check > mobile-tsc.txt 2>&1
          MOBILE_TSC=$?
          printf 'web_lint=%s\nmobile_lint=%s\nweb_tsc=%s\nmobile_tsc=%s\n' "$WEB_LINT" "$MOBILE_LINT" "$WEB_TSC" "$MOBILE_TSC" | tee static-status.txt
          set -e

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr7-static-diagnostics-${{ github.run_id }}
          path: |
            web-eslint.json
            mobile-eslint.json
            web-tsc.txt
            mobile-tsc.txt
            static-status.txt
          if-no-files-found: error
          retention-days: 3
