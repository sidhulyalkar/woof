name: Deploy to Production
run-name: Promote ${{ inputs.release_sha }} to production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character main commit SHA already qualified in staging
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-release-candidate:
    name: Validate Production Release Candidate
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Validate exact requested SHA
        id: candidate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid release SHA::Production promotion requires an exact lowercase 40-character Git SHA."
            exit 1
          fi
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0

      - name: Require candidate to be on main
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          git fetch origin main --no-tags --prune
          actual=$(git rev-parse HEAD)
          if [[ "${actual}" != "${RELEASE_SHA}" ]]; then
            echo "::error title=Checkout mismatch::Expected ${RELEASE_SHA}, checked out ${actual}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "::error title=Untrusted production candidate::${RELEASE_SHA} is not reachable from origin/main."
            exit 1
          fi

      - name: Require exact-SHA canonical main release checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: python3 .github/scripts/verify-main-release-checks.py

      - name: Verify exact staging qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          count=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml/runs" \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=20 \
            --jq '[.workflow_runs[] | select(.head_sha == "'"${RELEASE_SHA}"'" and .conclusion == "success")] | length')
          if [[ "${count}" -lt 1 ]]; then
            echo "::error title=Missing staging qualification::No successful Deploy to Staging workflow was found for ${RELEASE_SHA}."
            exit 1
          fi
          echo "Found ${count} successful staging qualification run(s) for ${RELEASE_SHA}."

  deploy-api-production:
    name: Deploy API to Production
    runs-on: ubuntu-latest
    environment: production
    needs: validate-release-candidate
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      RELEASE_SHA: ${{ needs.validate-release-candidate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate production API deployment credentials
        run: |
          if [[ -z "${FLY_API_TOKEN}" ]]; then
            echo "::error title=Missing production secret::FLY_API_TOKEN is not configured for the production environment. Add a Fly deploy token before rerunning this workflow."
            exit 1
          fi

      - name: Install pinned Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.76

      - name: Deploy API with migration, release identity and readiness gates
        run: >-
          flyctl deploy .
          --remote-only
          --app woof-api-prod
          --config apps/api/fly.toml
          --build-arg WOOF_RELEASE_SHA="${RELEASE_SHA}"

      - name: Capture liveness and readiness evidence
        id: release_bodies
        run: |
          live=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 \
            https://woof-api-prod.fly.dev/api/v1/ops/health/live)
          ready=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 \
            https://woof-api-prod.fly.dev/api/v1/ops/health/ready)
          {
            echo 'live<<EOF'
            echo "$live"
            echo EOF
            echo 'ready<<EOF'
            echo "$ready"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Enforce deployed API release identity
        env:
          LIVE_BODY: ${{ steps.release_bodies.outputs.live }}
          READY_BODY: ${{ steps.release_bodies.outputs.ready }}
        run: |
          node - <<'NODE'
          const expected = process.env.RELEASE_SHA;
          for (const [name, raw] of Object.entries({ live: process.env.LIVE_BODY, ready: process.env.READY_BODY })) {
            const parsed = JSON.parse(raw);
            if (parsed.release !== expected) {
              throw new Error(`${name} release mismatch: expected ${expected}, received ${parsed.release}`);
            }
          }
          NODE

      - name: Notify production API deployment when configured
        if: ${{ always() }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK is not configured; skipping optional deployment notification."
            exit 0
          fi
          payload=$(printf '{"text":"Woof production API deployment: %s (%.12s)"}' \
            "${DEPLOYMENT_STATUS}" "${RELEASE_SHA}")
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "${SLACK_WEBHOOK_URL}"

  deploy-web-production:
    name: Deploy Web to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [validate-release-candidate, deploy-api-production]
    outputs:
      deployment_url: ${{ steps.deploy_web.outputs.url }}
      web_origin: ${{ steps.web_origin.outputs.origin }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      STABLE_WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      EXPECTED_API_URL: https://woof-api-prod.fly.dev/api/v1
      RELEASE_SHA: ${{ needs.validate-release-candidate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate production Web deployment authority
        id: web_origin
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID STABLE_WEB_ORIGIN; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing production authority::${name} is not configured for the production environment."
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          origin=$(node -e "const u=new URL(process.env.STABLE_WEB_ORIGIN); if(u.protocol!=='https:'||u.origin!==process.env.STABLE_WEB_ORIGIN.replace(/\/$/,'')) process.exit(1); process.stdout.write(u.origin)")
          echo "origin=${origin}" >> "$GITHUB_OUTPUT"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Pull production Vercel project information
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        working-directory: apps/web

      - name: Build Project Artifacts
        run: vercel build --prod --token="${VERCEL_TOKEN}"
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.EXPECTED_API_URL }}
          NEXT_PUBLIC_WOOF_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          NEXT_PUBLIC_SENTRY_REPLAY_ENABLED: 'false'

      - name: Deploy to Vercel
        id: deploy_web
        working-directory: apps/web
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}" | tail -n 1 | tr -d '\r')
          if [[ ! "${deployment_url}" =~ ^https:// ]]; then
            echo "::error title=Invalid Vercel deployment URL::Expected an HTTPS deployment URL, received '${deployment_url}'."
            exit 1
          fi
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Web deployment release and API integration
        env:
          WEB_URL: ${{ steps.deploy_web.outputs.url }}
          EXPECTED_RELEASE: ${{ env.RELEASE_SHA }}
        run: |
          html=$(curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            "${WEB_URL}/demo")
          WEB_HTML="$html" node .github/scripts/verify-web-deployment-provenance.mjs

      - name: Verify stable production Web origin release and API integration
        env:
          WEB_URL: ${{ steps.web_origin.outputs.origin }}
          EXPECTED_RELEASE: ${{ env.RELEASE_SHA }}
        run: |
          html=$(curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            "${WEB_URL}/demo")
          WEB_HTML="$html" node .github/scripts/verify-web-deployment-provenance.mjs

      - name: Run non-destructive live release smoke
        env:
          API_URL: ${{ env.EXPECTED_API_URL }}
          WEB_ORIGIN: ${{ steps.web_origin.outputs.origin }}
          EXPECTED_RELEASE: ${{ env.RELEASE_SHA }}
        run: node .github/scripts/verify-live-release.mjs

      - name: Notify production Web deployment when configured
        if: ${{ always() }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK is not configured; skipping optional deployment notification."
            exit 0
          fi
          payload=$(printf '{"text":"Woof production Web deployment: %s (%.12s)"}' \
            "${DEPLOYMENT_STATUS}" "${RELEASE_SHA}")
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "${SLACK_WEBHOOK_URL}"

  retain-production-release-receipt:
    name: Retain Production Release Receipt
    runs-on: ubuntu-latest
    needs: [validate-release-candidate, deploy-api-production, deploy-web-production]
    env:
      RELEASE_SHA: ${{ needs.validate-release-candidate.outputs.release_sha }}
      WEB_URL: ${{ needs.deploy-web-production.outputs.web_origin }}
      WEB_DEPLOYMENT_URL: ${{ needs.deploy-web-production.outputs.deployment_url }}
      API_URL: https://woof-api-prod.fly.dev/api/v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Write privacy-safe production release receipt
        env:
          RELEASE_ENVIRONMENT: production
          RELEASE_RECEIPT_PATH: .release-evidence/production-release-receipt.json
          CANONICAL_RELEASE_CHECKS_VERIFIED: 'true'
          LIVE_BLACK_BOX_VERIFIED: 'true'
          STAGING_WORKFLOW_VERIFIED: 'true'
        run: node .github/scripts/write-release-receipt.mjs

      - name: Retain production release receipt
        uses: actions/upload-artifact@v7
        with:
          name: production-release-${{ env.RELEASE_SHA }}
          path: .release-evidence/production-release-receipt.json
          if-no-files-found: error
          retention-days: 90
