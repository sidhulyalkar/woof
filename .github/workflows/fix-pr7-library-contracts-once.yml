name: Fix PR7 library contracts once

on:
  pull_request:
    paths:
      - '.github/workflows/fix-pr7-library-contracts-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Patch Library runtime and browser contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('apps/web/src/app/library/page.tsx')
          page = page_path.read_text()

          replacements = [
              (
                  "    enabled: Boolean(petId),\n  });",
                  "    enabled: Boolean(petId),\n    retry: 1,\n  });",
              ),
              (
                  "        {newAlbumOpen && (",
                  """        {uploadMutation.isPending && (\n          <div\n            data-testid=\"media-library-uploading\"\n            role=\"status\"\n            className=\"flex items-center rounded-2xl border border-primary/15 bg-primary/[0.055] px-4 py-3 text-sm\"\n          >\n            <Loader2 className=\"mr-2 h-4 w-4 animate-spin\" aria-hidden=\"true\" />\n            <span>Saving your moment privately…</span>\n          </div>\n        )}\n\n        {newAlbumOpen && (""",
              ),
              (
                  "        <section>\n          <div className=\"mb-3 flex items-center justify-between gap-3\">\n            <h2 className=\"font-semibold\">Albums</h2>",
                  "        <section data-testid=\"media-library-albums\">\n          <div className=\"mb-3 flex items-center justify-between gap-3\">\n            <h2 className=\"font-semibold\">Albums</h2>",
              ),
              (
                  "        ) : assets.length === 0 ? (",
                  """        ) : libraryQuery.isError ? (\n          <section\n            data-testid=\"media-library-error\"\n            className=\"rounded-3xl border border-destructive/25 bg-destructive/[0.045] p-6\"\n          >\n            <h2 className=\"font-semibold\">Private library unavailable</h2>\n            <p className=\"mt-2 max-w-xl text-sm text-muted-foreground\">\n              Woof could not open this private library right now. Your media has not been changed.\n            </p>\n            <Button\n              type=\"button\"\n              variant=\"outline\"\n              className=\"mt-4\"\n              onClick={() => void libraryQuery.refetch()}\n            >\n              Try again\n            </Button>\n          </section>\n        ) : assets.length === 0 ? (""",
              ),
              (
                  "          <section className=\"rounded-3xl border border-dashed border-border p-10 text-center\">",
                  "          <section\n            data-testid=\"media-library-empty\"\n            className=\"rounded-3xl border border-dashed border-border p-10 text-center\"\n          >",
              ),
              (
                  "          <section className=\"grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4\">",
                  "          <section\n            data-testid=\"media-library-grid\"\n            className=\"grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4\"\n          >",
              ),
              (
                  "                <article\n                  key={asset.id}\n                  className=\"group relative overflow-hidden rounded-2xl bg-muted\"",
                  "                <article\n                  key={asset.id}\n                  data-asset-id={asset.id}\n                  className=\"group relative overflow-hidden rounded-2xl bg-muted\"",
              ),
          ]

          for old, new in replacements:
              count = page.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one page replacement, found {count}: {old[:80]!r}')
              page = page.replace(old, new, 1)

          page_path.write_text(page)

          test_path = Path('apps/web/e2e/library-regression.spec.ts')
          test = test_path.read_text()
          old = """  await page.goto('/login');\n  await page.evaluate(() => localStorage.setItem('authToken', 'browser-test-token'));"""
          new = """  await page.addInitScript(() => {\n    window.localStorage.setItem('authToken', 'browser-test-token');\n  });"""
          count = test.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one auth helper replacement, found {count}')
          test_path.write_text(test.replace(old, new, 1))
          PY

          pnpm exec prettier --write \
            apps/web/src/app/library/page.tsx \
            apps/web/e2e/library-regression.spec.ts

      - name: Remove helper and commit exact paths
        run: |
          rm .github/workflows/fix-pr7-library-contracts-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/library/page.tsx \
            apps/web/e2e/library-regression.spec.ts \
            .github/workflows/fix-pr7-library-contracts-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(web): harden private library browser contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
