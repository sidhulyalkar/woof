name: CI Action Runtime Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/CI_ACTION_RUNTIME.md'

permissions:
  contents: read

concurrency:
  group: ci-action-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  qualify:
    name: Maintained action runtime + project toolchain qualification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify project runtime stays pinned
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Enforce maintained and pinned action refs across every workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          allowed = {
              'actions/checkout': 'v7',
              'actions/setup-node': 'v7',
              'pnpm/action-setup': 'v6',
              'actions/upload-artifact': 'v7',
              'github/codeql-action/init': 'v4',
              'github/codeql-action/analyze': 'v4',
              'superfly/flyctl-actions/setup-flyctl': 'fc53c09e1bc3be6f54706524e3b82c4f462f77be',
          }

          workflows = sorted(Path('.github/workflows').glob('*.yml'))
          if not workflows:
              raise SystemExit('no GitHub Actions workflows found')

          seen = {action: 0 for action in allowed}
          violations = []
          for workflow in workflows:
              for line_number, line in enumerate(workflow.read_text().splitlines(), start=1):
                  stripped = line.strip()
                  if not stripped.startswith('- uses:') and not stripped.startswith('uses:'):
                      continue
                  for action, expected_version in allowed.items():
                      marker = f'{action}@'
                      if marker not in stripped:
                          continue
                      seen[action] += 1
                      actual_version = stripped.split(marker, 1)[1].split()[0].strip("'\"")
                      if actual_version != expected_version:
                          violations.append(
                              f'{workflow}:{line_number}: {action}@{actual_version} '
                              f'must be {action}@{expected_version}'
                          )

          if violations:
              raise SystemExit('\n'.join(violations))

          required = [
              'actions/checkout',
              'actions/setup-node',
              'pnpm/action-setup',
              'github/codeql-action/init',
              'github/codeql-action/analyze',
              'superfly/flyctl-actions/setup-flyctl',
          ]
          missing = [action for action in required if seen[action] == 0]
          if missing:
              raise SystemExit(f'missing required maintained action families: {missing}')
          PY

      - name: Enforce explicit deployment credential and notification contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          production = Path('.github/workflows/deploy-production.yml').read_text()
          staging = Path('.github/workflows/deploy-staging.yml').read_text()

          def secret_mapping(env_name: str, secret_name: str | None = None) -> str:
              secret_name = secret_name or env_name
              return f'{env_name}: $' + '{{ secrets.' + secret_name + ' }}'

          required_production = [
              secret_mapping('FLY_API_TOKEN'),
              secret_mapping('VERCEL_TOKEN'),
              secret_mapping('VERCEL_ORG_ID'),
              secret_mapping('VERCEL_PROJECT_ID'),
              'Validate production API deployment credentials',
              'Validate production Web deployment credentials',
          ]
          required_staging = [
              secret_mapping('FLY_API_TOKEN'),
              secret_mapping('VERCEL_TOKEN'),
              secret_mapping('VERCEL_ORG_ID'),
              secret_mapping('VERCEL_PROJECT_ID'),
              'Validate staging API deployment credentials',
              'Validate staging Web deployment credentials',
          ]

          missing = [
              f'production:{marker}'
              for marker in required_production
              if marker not in production
          ] + [
              f'staging:{marker}'
              for marker in required_staging
              if marker not in staging
          ]
          if missing:
              raise SystemExit('deployment credential contract drift:\n' + '\n'.join(missing))

          forbidden = '8398a7/action-slack'
          if forbidden in production or forbidden in staging:
              raise SystemExit(
                  'deployment workflows must not use the legacy action-slack integration; '
                  'notifications are optional and must not own deployment success'
              )

          notification_markers = [
              secret_mapping('SLACK_WEBHOOK_URL', 'SLACK_WEBHOOK'),
              'continue-on-error: true',
              'skipping optional deployment notification',
          ]
          notification_missing = [
              marker for marker in notification_markers if marker not in production
          ]
          if notification_missing:
              raise SystemExit(
                  'production notification contract drift:\n'
                  + '\n'.join(notification_missing)
              )
          PY

      - name: Exercise pinned Fly.io setup action
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.76

      - name: Verify pinned Fly.io CLI
        run: flyctl version | grep -F '0.4.76'

      - name: Parse and format-check the complete workflow inventory
        run: pnpm exec prettier --check .github/workflows docs/CI_ACTION_RUNTIME.md

      - name: Record qualification proof
        run: |
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "flyctl=$(flyctl version | head -n 1)"
            echo "workflows=$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')"
          } > /tmp/ci-action-runtime-proof.txt
          cat /tmp/ci-action-runtime-proof.txt

      - name: Exercise maintained artifact upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: ci-action-runtime-${{ github.run_id }}
          path: /tmp/ci-action-runtime-proof.txt
          if-no-files-found: error
          retention-days: 1
