name: Finalize Adventure redesign

on:
  push:
    branches: [agent/woof-adventure-system-v1]

permissions:
  contents: write

concurrency:
  group: finalize-adventure-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/woof-adventure-system-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic hardening patches
        run: python scripts/finalize-adventure-system.py

      - name: Format redesign files
        run: >-
          pnpm exec prettier --write
          .github/workflows/ci.yml
          .github/workflows/adventure-system-ci.yml
          apps/api/src/adventure
          apps/api/src/care-events
          apps/api/src/activities/activities.module.ts
          apps/api/src/activities/activities.service.ts
          apps/api/src/coaching/coaching.controller.ts
          apps/api/src/coaching/coaching.module.ts
          apps/api/src/gamification/gamification.controller.ts
          apps/api/src/app.module.ts
          apps/web/src/app/page.tsx
          apps/web/src/app/compass
          apps/web/src/app/journey
          apps/web/src/app/pack
          apps/web/src/app/health/page.tsx
          apps/web/src/components/bottom-nav.tsx
          apps/web/src/lib/api/adventure.ts
          apps/web/src/lib/api/pack.ts
          docs/WOOF_ADVENTURE_SYSTEM.md

      - name: Remove one-run finalization machinery
        run: git rm scripts/finalize-adventure-system.py .github/workflows/publish-adventure-finalization.yml

      - name: Publish finalized redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/adventure-system-ci.yml \
            apps/api/src/adventure \
            apps/api/src/care-events \
            apps/api/src/activities/activities.module.ts \
            apps/api/src/activities/activities.service.ts \
            apps/api/src/coaching/coaching.controller.ts \
            apps/api/src/coaching/coaching.module.ts \
            apps/api/src/gamification/gamification.controller.ts \
            apps/api/src/app.module.ts \
            apps/web/src/app/page.tsx \
            apps/web/src/app/compass \
            apps/web/src/app/journey \
            apps/web/src/app/pack \
            apps/web/src/app/health/page.tsx \
            apps/web/src/components/bottom-nav.tsx \
            apps/web/src/lib/api/adventure.ts \
            apps/web/src/lib/api/pack.ts \
            docs/WOOF_ADVENTURE_SYSTEM.md
          if git diff --cached --quiet; then
            echo "No finalization changes required."
            exit 0
          fi
          git commit -m "chore(adventure): finalize formatting and emergency safety chrome"
          git push origin HEAD:agent/woof-adventure-system-v1
