name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - agent/beta-learning-platform-v1
    paths:
      - .github/workflows/bootstrap-lockfile.yml
      - package.json
      - pnpm-workspace.yaml
      - 'apps/*/package.json'
      - 'packages/*/package.json'

permissions:
  contents: write

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  lockfile:
    name: Generate reproducible lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beta-learning-platform-v1
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify lockfile resolves with frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already reproducible and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "build: commit reproducible pnpm lockfile"
          git push origin HEAD:agent/beta-learning-platform-v1
