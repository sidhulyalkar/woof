name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - agent/beta-learning-platform-v1
    paths:
      - .github/workflows/bootstrap-lockfile.yml
      - package.json
      - pnpm-workspace.yaml
      - 'apps/*/package.json'
      - 'packages/*/package.json'

permissions:
  contents: write

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  lockfile:
    name: Generate and commit reproducible lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beta-learning-platform-v1
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify lockfile resolves without mutation
        run: |
          cp pnpm-lock.yaml /tmp/pnpm-lock.before.yaml
          pnpm install --frozen-lockfile --ignore-scripts
          cmp --silent /tmp/pnpm-lock.before.yaml pnpm-lock.yaml
          sha256sum pnpm-lock.yaml

      - name: Commit lockfile to beta branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already committed and reproducible."
            exit 0
          fi
          git commit -m "build: commit reproducible pnpm lockfile"
          git push origin HEAD:agent/beta-learning-platform-v1
