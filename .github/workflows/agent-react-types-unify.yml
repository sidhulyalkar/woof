name: Temporary React type authority materializer

on:
  push:
    branches:
      - agent/expo-sdk54-alignment-v1

permissions:
  contents: write

concurrency:
  group: temporary-react-types-unify
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'
  CI: '1'

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/expo-sdk54-alignment-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Regenerate canonical lock importer
        run: pnpm install --lockfile-only

      - name: Install regenerated frozen graph
        run: pnpm install --frozen-lockfile

      - name: Prove Web type authority is unified
        run: pnpm --filter @woof/web type-check

      - name: Preserve Expo SDK compatibility
        working-directory: apps/mobile
        run: pnpm exec expo install --check --pnpm

      - name: Preserve native type and lint gates
        run: |
          pnpm --filter @woof/mobile type-check
          pnpm --filter @woof/mobile lint

      - name: Reject unexpected generated changes
        run: |
          unexpected=$(git status --porcelain | grep -Ev '^ M pnpm-lock.yaml$|^M  pnpm-lock.yaml$' || true)
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected materializer changes:'
            echo "${unexpected}"
            exit 1
          fi

      - name: Commit canonical lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already matches the unified type authority.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Regenerate lockfile for unified React type authority'
          git push origin HEAD:agent/expo-sdk54-alignment-v1
