name: Temporary Expo SDK 54 alignment

on:
  push:
    branches:
      - agent/expo-sdk54-alignment-v1

permissions:
  contents: write

concurrency:
  group: temporary-expo-sdk54-alignment
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'
  CI: '1'

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/expo-sdk54-alignment-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install current frozen graph
        run: pnpm install --frozen-lockfile

      - name: Pin Expo-managed navigation manifest range
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'apps/mobile/package.json';
          const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));
          packageJson.dependencies['@react-navigation/bottom-tabs'] = '^7.4.0';
          fs.writeFileSync(path, JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      - name: Align managed dependencies to installed Expo SDK
        working-directory: apps/mobile
        run: |
          pnpm exec expo install --fix --pnpm
          # Upgrading one managed package can change compatibility expectations
          # for another package (for example expo-router -> React Navigation).
          # A second pass converges the dependency validator to a fixed point.
          pnpm exec expo install --fix --pnpm

      - name: Prove Expo dependency validation is clean
        working-directory: apps/mobile
        run: pnpm exec expo install --check --pnpm

      - name: Type-check aligned native client
        run: pnpm --filter @woof/mobile type-check

      - name: Lint aligned native client
        run: pnpm --filter @woof/mobile lint

      - name: Reject unexpected generated changes
        run: |
          unexpected=$(git status --porcelain | grep -Ev '^ M apps/mobile/package.json$|^ M pnpm-lock.yaml$|^M  apps/mobile/package.json$|^M  pnpm-lock.yaml$|^ M apps/mobile/package-lock.json$|^\?\? apps/mobile/package-lock.json$' || true)
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected Expo fixer changes:"
            echo "${unexpected}"
            exit 1
          fi
          rm -f apps/mobile/package-lock.json

      - name: Commit canonical package and lock alignment
        run: |
          if git diff --quiet -- apps/mobile/package.json pnpm-lock.yaml; then
            echo 'Expo dependency graph already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package.json pnpm-lock.yaml
          git commit -m 'Align native dependencies with Expo SDK 54'
          git push origin HEAD:agent/expo-sdk54-alignment-v1
