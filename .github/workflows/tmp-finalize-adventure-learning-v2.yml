name: Temporary finalize Adventure learning v2

on:
  push:
    branches: [agent/tmp-finalize-adventure-learning-v2]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adventure-learning-signals-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finalize Adventure learning provenance and scope
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('apps/api/src/adventure/adventure-learning-policy.ts')
          text = policy.read_text()
          old = '''  for (const event of canonical) {\n    const ageDays = Math.max(0, (now.getTime() - new Date(event.occurredAt).getTime()) / DAY_MS);\n    const outcome = event.outcome ?? {};'''
          new = '''  for (const event of canonical) {\n    if (!isAdventureOutcomeEvent(event.eventType)) continue;\n\n    const ageDays = Math.max(0, (now.getTime() - new Date(event.occurredAt).getTime()) / DAY_MS);\n    const outcome = event.outcome ?? {};'''
          if old not in text:
              raise SystemExit('policy event-loop anchor not found')
          text = text.replace(old, new, 1)
          anchor = '''function learningPathway(event: AdventureLearningEvent): WellbeingPathway | null {'''
          inserted = '''function isAdventureOutcomeEvent(eventType: string) {\n  return eventType === 'SAFE_OPT_OUT' || eventType.startsWith('QUEST_');\n}\n\n'''
          if anchor not in text:
              raise SystemExit('policy helper insertion anchor not found')
          policy.write_text(text.replace(anchor, inserted + anchor, 1))

          policy_spec = Path('apps/api/src/adventure/adventure-learning-policy.spec.ts')
          text = policy_spec.read_text()
          anchor = '''  it('does not use reward XP as a learning input', () => {'''
          inserted = '''  it('ignores non-Adventure CareEvents even when their JSON reuses outcome-like keys', () => {\n    const result = deriveAdventureLearningSignals(\n      [\n        event({\n          id: 'unrelated-care-event',\n          eventType: 'DAILY_SIGNALS_CHECKIN',\n          pathway: 'CARE',\n          context: { originalPathway: 'LEARN' },\n          outcome: {\n            dogExperience: 'not_their_thing',\n            ownerExperience: 'a_lot_today',\n            safeOptOut: false,\n          },\n        }),\n      ],\n      NOW\n    );\n\n    expect(result.durablePathwayPreference).toEqual({});\n    expect(result.temporaryPathwayModifier).toEqual({});\n    expect(result.temporaryPace).toBe('normal');\n  });\n\n'''
          if anchor not in text:
              raise SystemExit('policy spec isolation anchor not found')
          policy_spec.write_text(text.replace(anchor, inserted + anchor, 1))

          service = Path('apps/api/src/adventure/adventure.service.ts')
          text = service.read_text()
          old = '''import {\n  deriveAdventureLearningSignals,\n  type AdventureLearningSignals,\n} from './adventure-learning-policy';'''
          new = '''import {\n  ADVENTURE_LEARNING_POLICY_VERSION,\n  deriveAdventureLearningSignals,\n  type AdventureLearningSignals,\n} from './adventure-learning-policy';'''
          if old not in text:
              raise SystemExit('Adventure learning import anchor not found')
          text = text.replace(old, new, 1)

          old = '''      context: {\n        questKey: quest.key,\n        confidence: quest.confidence,\n        ...(interaction === 'SELECTED' ? { questSnapshot: this.questSnapshot(quest) } : {}),\n      },'''
          new = '''      context: {\n        questKey: quest.key,\n        confidence: quest.confidence,\n        learningPolicyVersion: ADVENTURE_LEARNING_POLICY_VERSION,\n        ...(interaction === 'SELECTED' ? { questSnapshot: this.questSnapshot(quest) } : {}),\n      },'''
          if old not in text:
              raise SystemExit('selection provenance anchor not found')
          text = text.replace(old, new, 1)

          old = '''        originalPathway: quest.primaryPathway,\n        personalRelevance: quest.personalRelevance,'''
          new = '''        originalPathway: quest.primaryPathway,\n        learningPolicyVersion: ADVENTURE_LEARNING_POLICY_VERSION,\n        personalRelevance: quest.personalRelevance,'''
          if old not in text:
              raise SystemExit('CareEvent provenance anchor not found')
          text = text.replace(old, new, 1)

          old = '''          originalPathway: quest.primaryPathway,\n          rewardPathway,\n          dogExperience: dto.dogExperience,'''
          new = '''          originalPathway: quest.primaryPathway,\n          rewardPathway,\n          learningPolicyVersion: ADVENTURE_LEARNING_POLICY_VERSION,\n          dogExperience: dto.dogExperience,'''
          if old not in text:
              raise SystemExit('interaction provenance anchor not found')
          text = text.replace(old, new, 1)

          old = '''            originalPathway: quest.primaryPathway,\n            rewardPathway,\n            bondXp: receipt.bondXp,'''
          new = '''            originalPathway: quest.primaryPathway,\n            rewardPathway,\n            learningPolicyVersion: ADVENTURE_LEARNING_POLICY_VERSION,\n            bondXp: receipt.bondXp,'''
          if old not in text:
              raise SystemExit('telemetry provenance anchor not found')
          service.write_text(text.replace(old, new, 1))

          service_spec = Path('apps/api/src/adventure/adventure.service.spec.ts')
          text = service_spec.read_text()
          old = '''        context: expect.objectContaining({\n          questSnapshot: {'''
          new = '''        context: expect.objectContaining({\n          learningPolicyVersion: 'adventure-learning-v2',\n          questSnapshot: {'''
          if old not in text:
              raise SystemExit('selection spec provenance anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''context: expect.objectContaining({ originalPathway: 'LEARN', rewardPathway: 'BOND' }),''',
              '''context: expect.objectContaining({\n          originalPathway: 'LEARN',\n          rewardPathway: 'BOND',\n          learningPolicyVersion: 'adventure-learning-v2',\n        }),''',
          )
          text = text.replace(
              '''            rewardPathway: 'BOND',\n          }),''',
              '''            rewardPathway: 'BOND',\n            learningPolicyVersion: 'adventure-learning-v2',\n          }),''',
              1,
          )
          service_spec.write_text(text)

          integration = Path('apps/api/src/care-events/care-events.integration.spec.ts')
          text = integration.read_text()
          anchor = '''  it('does not let a zero-XP safety event decay the next legitimate reward', async () => {'''
          inserted = '''  it('preserves original quest pathway separately from the reward pathway in summaries', async () => {\n    const { userId, petId } = await fixture('learning-provenance');\n    const receipt = await service.record({\n      userId,\n      petId,\n      eventType: 'QUEST_BOND',\n      pathway: 'BOND',\n      source: 'QUEST_ENGINE',\n      evidenceType: 'SELF_REPORT',\n      evidenceConfidence: 0.68,\n      dedupeKey: `learning-provenance:${randomUUID()}`,\n      safetyEligible: true,\n      context: {\n        originalPathway: 'LEARN',\n        learningPolicyVersion: 'adventure-learning-v2',\n      },\n      outcome: {\n        dogExperience: 'not_their_thing',\n        ownerExperience: 'fine',\n        safeOptOut: false,\n      },\n    });\n\n    const summary = await service.getSummary(userId, petId);\n    const stored = summary.recentEvents.find((entry) => entry.id === receipt.careEventId);\n\n    expect(stored).toEqual(\n      expect.objectContaining({\n        pathway: 'BOND',\n        context: expect.objectContaining({\n          originalPathway: 'LEARN',\n          learningPolicyVersion: 'adventure-learning-v2',\n        }),\n        outcome: expect.objectContaining({ dogExperience: 'not_their_thing' }),\n      })\n    );\n  });\n\n'''
          if anchor not in text:
              raise SystemExit('CareEvent integration insertion anchor not found')
          integration.write_text(text.replace(anchor, inserted + anchor, 1))
          PY
      - name: Format finalized TypeScript
        run: >-
          pnpm exec prettier --write
          apps/api/src/adventure/adventure-learning-policy.ts
          apps/api/src/adventure/adventure-learning-policy.spec.ts
          apps/api/src/adventure/adventure.service.ts
          apps/api/src/adventure/adventure.service.spec.ts
          apps/api/src/care-events/care-events.integration.spec.ts
      - name: Commit final learning semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/adventure/adventure-learning-policy.ts \
            apps/api/src/adventure/adventure-learning-policy.spec.ts \
            apps/api/src/adventure/adventure.service.ts \
            apps/api/src/adventure/adventure.service.spec.ts \
            apps/api/src/care-events/care-events.integration.spec.ts
          git commit -m "Finalize Adventure learning v2 provenance"
          git push origin HEAD:agent/adventure-learning-signals-v2
