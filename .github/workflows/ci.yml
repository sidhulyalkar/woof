name: CI

on:
  push:
    branches: [main, develop, 'agent/beta-learning-platform-v1']
  pull_request:
    branches: [main, develop]

# Temporary write scope is used only by the guarded same-repository lockfile
# publication step. It is removed immediately after pnpm-lock.yaml lands.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  quality:
    name: Static quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Capture resolved lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-candidate-${{ github.run_id }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Publish final lockfile to same-repository beta branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          pnpm install --lockfile-only --no-frozen-lockfile
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already matches the pinned resolver output."
            exit 0
          fi
          git commit -m "build: commit reproducible pnpm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Generate Prisma client
        run: pnpm --filter @woof/database db:generate

      - name: Check release-critical formatting
        run: >-
          pnpm exec prettier --check
          package.json
          apps/api/package.json
          apps/api/jest.config.js
          apps/api/test/jest-e2e.json
          apps/web/package.json
          apps/web/vitest.config.ts
          apps/web/playwright.config.ts
          apps/web/src/lib/api-client.ts
          apps/web/e2e
          packages/ui/package.json

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woof_test
        options: >-
          --health-cmd "pg_isready -U postgres -d woof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_test
      JWT_SECRET: ci-only-test-secret
      NODE_ENV: test
      ML_SERVICE_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @woof/database db:generate

      - name: Apply database migrations
        run: pnpm --filter @woof/database db:migrate:deploy

      - name: Run backend unit tests
        run: pnpm --filter @woof/api exec jest --runInBand

      - name: Run backend API tests
        run: pnpm --filter @woof/api exec jest --config ./test/jest-e2e.json --runInBand

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:59999/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm --filter @woof/web test

      - name: Install Playwright Chromium
        run: pnpm --filter @woof/web exec playwright install --with-deps chromium

      - name: Run browser smoke, accessibility and visual contracts
        run: pnpm --filter @woof/web exec playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production builds
    needs: [quality, test-backend, test-frontend]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
      ML_SERVICE_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @woof/database db:generate

      - name: Build API
        run: pnpm --filter @woof/api build

      - name: Build Web
        run: pnpm --filter @woof/web build
