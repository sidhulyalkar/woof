name: Temporary exact Health Lens qualification 44f7

on:
  push:
    branches: [agent/qualify-health-lens-44f7]

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woof_test
        options: >-
          --health-cmd "pg_isready -U postgres -d woof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_test
      JWT_SECRET: exact-health-lens-qualification-only
      NODE_ENV: test
      ML_SERVICE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 44f7a9c6891dc72f0ae4752fadd960ab4a70b4bc
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @woof/database db:generate
      - name: Apply canonical database migrations
        run: pnpm --filter @woof/database db:migrate:deploy
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "44f7a9c6891dc72f0ae4752fadd960ab4a70b4bc"
      - name: Enforce Health Lens authority invariants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lens = fs.readFileSync('apps/api/src/health-lens/health-lens.service.ts', 'utf8');
          const model = fs.readFileSync('apps/api/src/health-lens/health-ai.service.ts', 'utf8');
          for (const token of ['screenEmergencyText', 'deterministic-emergency-screen', 'modelProvenance']) {
            if (!lens.includes(token)) throw new Error(`Missing Health Lens authority invariant: ${token}`);
          }
          for (const token of ['store: false', 'normalizeHealthModelResult', 'UNSAFE_OWNER_ACTION_PATTERNS', 'HEALTH_MODEL_POLICY_VERSION']) {
            if (!model.includes(token)) throw new Error(`Missing Health model authority invariant: ${token}`);
          }
          NODE
      - name: Check Health Lens formatting
        run: >-
          pnpm exec prettier --check
          .github/workflows/dogos-health-lens-ci.yml
          apps/api/src/health-lens/health-ai.service.ts
          apps/api/src/health-lens/health-ai.service.spec.ts
          apps/api/src/health-lens/health-lens.service.ts
          apps/api/src/health-lens/health-lens.service.spec.ts
          apps/api/src/health-lens/health-triage.ts
          apps/api/src/health-lens/health-triage.spec.ts
      - name: Lint monorepo
        run: pnpm lint
      - name: Type-check monorepo
        run: pnpm type-check
      - name: Run Health Lens safety contracts
        run: >-
          pnpm --filter @woof/api exec jest --runInBand
          src/health-lens/health-ai.service.spec.ts
          src/health-lens/health-lens.service.spec.ts
          src/health-lens/health-triage.spec.ts
      - name: Run full API unit and integration suite
        run: pnpm --filter @woof/api exec jest --runInBand
      - name: Build API
        run: pnpm --filter @woof/api build
      - name: Compile ML code
        run: python -m compileall -q ml
