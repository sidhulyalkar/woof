name: TEMP Exact Generated Diff

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/observability/operational-metrics.service.ts'
      - 'apps/api/src/observability/operational-metrics.service.spec.ts'
      - '.github/scripts/woof-alert-policy.py'
      - 'ops/alerts/**'
      - '.github/workflows/tmp-prettier-diff.yml'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '8.15.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact generated diffs
        run: |
          pnpm exec prettier --write \
            apps/api/src/observability/operational-metrics.service.ts \
            apps/api/src/observability/operational-metrics.service.spec.ts
          python .github/scripts/woof-alert-policy.py > /tmp/woof-api.rules.yml
          cp /tmp/woof-api.rules.yml ops/alerts/woof-api.rules.yml
          git diff -- \
            apps/api/src/observability/operational-metrics.service.ts \
            apps/api/src/observability/operational-metrics.service.spec.ts \
            ops/alerts/woof-api.rules.yml
          if ! git diff --quiet -- \
            apps/api/src/observability/operational-metrics.service.ts \
            apps/api/src/observability/operational-metrics.service.spec.ts \
            ops/alerts/woof-api.rules.yml; then
            echo 'TEMP_GENERATED_DIFF_PRESENT'
            exit 1
          fi
