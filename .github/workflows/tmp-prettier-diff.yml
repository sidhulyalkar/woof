name: TEMP Commit Exact Generated Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/observability/operational-metrics.service.ts'
      - 'apps/api/src/observability/operational-metrics.service.spec.ts'
      - '.github/scripts/woof-alert-policy.py'
      - 'ops/alerts/**'
      - '.github/workflows/tmp-prettier-diff.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: '8.15.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate exact artifacts
        run: |
          pnpm exec prettier --write \
            apps/api/src/observability/operational-metrics.service.ts \
            apps/api/src/observability/operational-metrics.service.spec.ts
          python .github/scripts/woof-alert-policy.py > ops/alerts/woof-api.rules.yml
      - name: Commit generated changes when needed
        run: |
          if git diff --quiet -- \
            apps/api/src/observability/operational-metrics.service.ts \
            apps/api/src/observability/operational-metrics.service.spec.ts \
            ops/alerts/woof-api.rules.yml; then
            echo 'Generated artifacts already exact.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/observability/operational-metrics.service.ts \
            apps/api/src/observability/operational-metrics.service.spec.ts \
            ops/alerts/woof-api.rules.yml
          git commit -m 'Regenerate exact operational alert artifacts'
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
