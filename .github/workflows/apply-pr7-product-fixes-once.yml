name: Apply PR7 product fixes once

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pr7-product-fixes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply exact browser and mobile repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/web/src/lib/api/client.ts',
              """  error => {\n    if (error.response) {\n      // If we get a 401 Unauthorized, it means our token is invalid or expired\n      if (error.response.status === 401) {\n        console.warn('API responded with 401, logging out');\n        localStorage.removeItem('authToken');\n        // Optionally, redirect to login page\n        if (typeof window !== 'undefined') {\n          window.location.pathname = '/login';\n        }\n      }\n    }\n    return Promise.reject(error);\n  }""",
              """  error => {\n    const requestHadAuthToken =\n      typeof window !== 'undefined' && Boolean(localStorage.getItem('authToken'));\n\n    if (error.response?.status === 401 && requestHadAuthToken) {\n      console.warn('Authenticated API request returned 401; clearing the stale session');\n      localStorage.removeItem('authToken');\n      if (window.location.pathname !== '/login') {\n        window.location.pathname = '/login';\n      }\n    }\n    return Promise.reject(error);\n  }""",
          )

          replace_once(
              'apps/web/e2e/library-regression.spec.ts',
              """    await page.getByTestId('media-library-grid').locator('[data-asset-id=\"asset-1\"]').click();\n    await expect(page.getByText(/1 selected/i)).toBeVisible();""",
              """    await page.getByRole('button', { name: /select asset-1[.]jpg/i }).click();\n    await expect(page.getByText(/1 selected/i)).toBeVisible();""",
          )
          replace_once(
              'apps/web/src/app/library/page.tsx',
              """              <div className=\"flex flex-wrap justify-end gap-2\">\n                <Button""",
              """              <div className=\"flex flex-wrap items-center justify-end gap-2\">\n                <span role=\"status\" aria-live=\"polite\" className=\"text-xs text-muted-foreground\">\n                  {selectedIds.length} selected\n                </span>\n                <Button""",
          )

          package_path = Path('apps/mobile/package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['expo-file-system'] = '~19.0.23'
          package['dependencies']['expo-sharing'] = '~14.0.8'
          package['dependencies'] = dict(sorted(package['dependencies'].items()))
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          goals = Path('apps/mobile/src/api/goals.ts')
          text = goals.read_text().replace('metadata?: any;', 'metadata?: unknown;')
          text = text.replace('const params: any = {};', 'const params: Record<string, string> = {};')
          for old, new in {
              """    const response = await apiClient.get('/goals', { params });\n    return response.data;""": """    return apiClient.get<Goal[]>('/goals', { params });""",
              """    const response = await apiClient.get(`/goals/${id}`);\n    return response.data;""": """    return apiClient.get<Goal>(`/goals/${id}`);""",
              """    const response = await apiClient.post('/goals', data);\n    return response.data;""": """    return apiClient.post<Goal>('/goals', data);""",
              """    const response = await apiClient.patch(`/goals/${id}`, data);\n    return response.data;""": """    return apiClient.patch<Goal>(`/goals/${id}`, data);""",
              """    const response = await apiClient.patch(`/goals/${id}/progress`, { value });\n    return response.data;""": """    return apiClient.patch<Goal>(`/goals/${id}/progress`, { value });""",
              """    const response = await apiClient.get('/goals/statistics');\n    return response.data;""": """    return apiClient.get<GoalStatistics>('/goals/statistics');""",
          }.items():
              if text.count(old) != 1:
                  raise SystemExit(f'goals.ts expected one response block: {old[:80]!r}')
              text = text.replace(old, new, 1)
          goals.write_text(text)

          replace_once('apps/mobile/src/screens/FeedScreen.tsx', '      setPosts(response.data);', '      setPosts(response.posts);')

          pets_list = Path('apps/mobile/src/screens/PetsListScreen.tsx')
          pets_text = pets_list.read_text()
          pets_text = pets_text.replace(
              "import { petsApi } from '../api/pets';\nimport { Pet } from '../types';",
              "import { petsApi } from '../api/pets';\nimport { useAuth } from '../contexts/AuthContext';\nimport { Pet } from '../types';",
              1,
          )
          pets_text = pets_text.replace(
              "export default function PetsListScreen({ navigation }: Props) {\n  const [pets, setPets] = useState<Pet[]>([]);",
              "export default function PetsListScreen({ navigation }: Props) {\n  const { user } = useAuth();\n  const [pets, setPets] = useState<Pet[]>([]);",
              1,
          )
          old_block = """    try {\n      const data = await petsApi.getMyPets();\n      setPets(data);"""
          new_block = """    try {\n      if (!user?.id) {\n        setPets([]);\n        return;\n      }\n      const data = await petsApi.getPets(user.id);\n      setPets(data.pets);"""
          if pets_text.count(old_block) != 1:
              raise SystemExit('PetsListScreen legacy owner query not unique')
          pets_list.write_text(pets_text.replace(old_block, new_block, 1))

          replace_once(
              'apps/mobile/src/screens/ProfileScreen.tsx',
              """        petsApi.getMyPets(),\n      ]);\n      setStats(statsData);\n      setPets(petsData);""",
              """        petsApi.getPets(user?.id),\n      ]);\n      setStats(statsData);\n      setPets(petsData.pets);""",
          )

          pets_api = Path('apps/mobile/src/api/pets.ts')
          pets_api_text = pets_api.read_text()
          marker = """  async getPet(id: string): Promise<Pet> {\n    return apiClient.get(`/pets/${id}`);\n  },"""
          replacement = """  /** Nearby discovery requires a dedicated privacy-preserving proximity API. */\n  async getNearbyPets(\n    _latitude: number,\n    _longitude: number,\n    _radiusMeters: number\n  ): Promise<Pet[]> {\n    return [];\n  },\n\n  async getPet(id: string): Promise<Pet> {\n    return apiClient.get(`/pets/${id}`);\n  },"""
          if pets_api_text.count(marker) != 1:
              raise SystemExit('pets.ts insertion point is not unique')
          pets_api.write_text(pets_api_text.replace(marker, replacement, 1))

          replace_once(
              'apps/mobile/src/media/apple-media-adapter.ts',
              "const info = await FileSystem.getInfoAsync(uri, { size: true });",
              "const info = await FileSystem.getInfoAsync(uri);",
          )

          animations = Path('apps/mobile/src/utils/animations.ts')
          animation_text = animations.read_text()
          for function_name, output_type in [
              ('createOpacityInterpolation', 'number'),
              ('createScaleInterpolation', 'number'),
              ('createRotationInterpolation', 'string'),
              ('createTranslateInterpolation', 'number'),
          ]:
              start = animation_text.index(f'export const {function_name}')
              needle = '): Animated.AnimatedInterpolation =>'
              position = animation_text.index(needle, start)
              animation_text = animation_text[:position] + f'): Animated.AnimatedInterpolation<{output_type}> =>' + animation_text[position + len(needle):]
          animations.write_text(animation_text)
          PY

          pnpm exec prettier --write \
            apps/web/src/lib/api/client.ts \
            apps/web/src/app/library/page.tsx \
            apps/web/e2e/library-regression.spec.ts \
            apps/mobile/package.json \
            apps/mobile/src/api/goals.ts \
            apps/mobile/src/api/pets.ts \
            apps/mobile/src/media/apple-media-adapter.ts \
            apps/mobile/src/screens/FeedScreen.tsx \
            apps/mobile/src/screens/PetsListScreen.tsx \
            apps/mobile/src/screens/ProfileScreen.tsx \
            apps/mobile/src/utils/animations.ts

      - name: Regenerate lockfile and prove mobile contract
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm --filter @woof/mobile type-check

      - name: Commit source and lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/lib/api/client.ts \
            apps/web/src/app/library/page.tsx \
            apps/web/e2e/library-regression.spec.ts \
            apps/mobile/package.json \
            apps/mobile/src/api/goals.ts \
            apps/mobile/src/api/pets.ts \
            apps/mobile/src/media/apple-media-adapter.ts \
            apps/mobile/src/screens/FeedScreen.tsx \
            apps/mobile/src/screens/PetsListScreen.tsx \
            apps/mobile/src/screens/ProfileScreen.tsx \
            apps/mobile/src/utils/animations.ts \
            pnpm-lock.yaml
          git commit -m "fix(release): align parent browser and mobile contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
