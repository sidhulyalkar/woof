name: dogOS Web Push Encryption CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/notifications/**'
      - 'apps/api/scripts/migrate-push-subscriptions.ts'
      - 'apps/api/src/connectors/connector-crypto.service.ts'
      - 'apps/api/src/connectors/connector-crypto.service.spec.ts'
      - 'apps/api/src/config/env.validation.ts'
      - 'apps/api/src/config/env.validation.spec.ts'
      - 'apps/api/.env.example'
      - 'apps/api/package.json'
      - 'apps/api/tsconfig.eslint.json'
      - 'apps/mobile/src/api/notifications.ts'
      - 'apps/web/src/hooks/use-push-notifications.ts'
      - 'apps/web/src/lib/api.ts'
      - 'docs/DOGOS_WEB_PUSH_ENCRYPTION.md'
      - 'docs/EXTERNAL_INTEGRATION_INVENTORY.json'
      - '.github/scripts/assert-push-subscription-encryption.py'
      - '.github/scripts/assert-integration-truth.py'
      - '.github/workflows/dogos-push-encryption-ci.yml'
      - '.github/workflows/integration-truth-ci.yml'

permissions:
  contents: read

concurrency:
  group: push-encryption-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'
  NODE_ENV: test
  JWT_SECRET: ci-only-test-secret

jobs:
  qualify:
    name: Encrypted storage + migration + recipient authority
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @woof/database db:generate

      - name: Materialize Web Push authority formatting
        run: >-
          pnpm exec prettier --write
          .github/workflows/dogos-push-encryption-ci.yml
          .github/workflows/integration-truth-ci.yml
          apps/api/package.json
          apps/api/tsconfig.eslint.json
          apps/api/scripts/migrate-push-subscriptions.ts
          apps/api/src/config/env.validation.ts
          apps/api/src/config/env.validation.spec.ts
          apps/api/src/notifications/dto/push-subscription.dto.ts
          apps/api/src/notifications/notifications.controller.ts
          apps/api/src/notifications/notifications.controller.spec.ts
          apps/api/src/notifications/notifications.module.ts
          apps/api/src/notifications/notifications.service.ts
          apps/api/src/notifications/notifications.service.spec.ts
          apps/api/src/notifications/push-subscription.store.ts
          apps/api/src/notifications/push-subscription.store.spec.ts
          apps/web/src/hooks/use-push-notifications.ts
          apps/web/src/lib/api.ts
          docs/DOGOS_WEB_PUSH_ENCRYPTION.md
          docs/EXTERNAL_INTEGRATION_INVENTORY.json

      - name: Enforce committed Web Push authority formatting
        run: git diff --exit-code

      - name: Validate encrypted Push authority source contract
        run: |
          python -m py_compile .github/scripts/assert-push-subscription-encryption.py
          python -m py_compile .github/scripts/assert-integration-truth.py
          python .github/scripts/assert-push-subscription-encryption.py
          python .github/scripts/assert-integration-truth.py

      - name: Lint owned API boundaries
        run: >-
          pnpm --filter @woof/api exec eslint --max-warnings=0 --report-unused-disable-directives --format stylish
          scripts/migrate-push-subscriptions.ts
          src/config/env.validation.ts
          src/config/env.validation.spec.ts
          src/connectors/connector-crypto.service.ts
          src/connectors/connector-crypto.service.spec.ts
          src/notifications/dto/push-subscription.dto.ts
          src/notifications/notifications.controller.ts
          src/notifications/notifications.controller.spec.ts
          src/notifications/notifications.module.ts
          src/notifications/notifications.service.ts
          src/notifications/notifications.service.spec.ts
          src/notifications/push-subscription.store.ts
          src/notifications/push-subscription.store.spec.ts

      - name: Lint owned Web boundaries
        run: >-
          pnpm --filter @woof/web exec eslint --max-warnings=0 --report-unused-disable-directives --format stylish
          src/hooks/use-push-notifications.ts
          src/lib/api.ts

      - name: Type-check API
        run: pnpm --filter @woof/api type-check

      - name: Type-check Web
        run: pnpm --filter @woof/web type-check

      - name: Run encrypted Push defining contracts
        run: >-
          pnpm --filter @woof/api exec jest --runInBand
          src/connectors/connector-crypto.service.spec.ts
          src/notifications/push-subscription.store.spec.ts
          src/notifications/notifications.service.spec.ts
          src/notifications/notifications.controller.spec.ts
          src/config/env.validation.spec.ts

      - name: Build API
        run: pnpm --filter @woof/api build

      - name: Build Web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-only-public-vapid-key
        run: pnpm --filter @woof/web build
