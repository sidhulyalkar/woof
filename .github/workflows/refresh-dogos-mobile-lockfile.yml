name: Refresh dogOS mobile lockfile once

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-dogos-mobile-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Refresh and prove frozen lockfile
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Remove helper and commit only lockfile
        run: |
          rm .github/workflows/refresh-dogos-mobile-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/refresh-dogos-mobile-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(mobile): refresh Expo media lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
