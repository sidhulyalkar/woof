name: Temporary wire Adventure learning v2

on:
  push:
    branches: [agent/tmp-wire-adventure-learning-v2]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adventure-learning-signals-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire canonical outcome context into Adventure learning
        run: |
          python - <<'PY'
          from pathlib import Path

          care = Path('apps/api/src/care-events/care-events.service.ts')
          text = care.read_text()
          old = '''type EventRow = {\n  id: string;\n  event_type: string;\n  pathway: WellbeingPathway;\n  occurred_at: Date;\n  outcome: Record<string, unknown> | null;\n};'''
          new = '''type EventRow = {\n  id: string;\n  event_type: string;\n  pathway: WellbeingPathway;\n  occurred_at: Date;\n  context: Record<string, unknown> | null;\n  outcome: Record<string, unknown> | null;\n};'''
          if old not in text:
              raise SystemExit('EventRow anchor not found')
          text = text.replace(old, new, 1)
          old = '''        SELECT ce.id, ce.event_type, ce.pathway, ce.occurred_at, ce.outcome,\n               COALESCE(rl.bond_xp, 0)::int AS bond_xp'''
          new = '''        SELECT ce.id, ce.event_type, ce.pathway, ce.occurred_at, ce.context, ce.outcome,\n               COALESCE(rl.bond_xp, 0)::int AS bond_xp'''
          if old not in text:
              raise SystemExit('recent summary SELECT anchor not found')
          text = text.replace(old, new, 1)
          old = '''        occurredAt: row.occurred_at.toISOString(),\n        outcome: row.outcome,\n        bondXp: row.bond_xp,'''
          new = '''        occurredAt: row.occurred_at.toISOString(),\n        context: row.context,\n        outcome: row.outcome,\n        bondXp: row.bond_xp,'''
          if old not in text:
              raise SystemExit('recent summary mapping anchor not found')
          care.write_text(text.replace(old, new, 1))

          adventure = Path('apps/api/src/adventure/adventure.service.ts')
          text = adventure.read_text()
          old = '''import { baseXpForEvent } from '../care-events/reward-policy';\nimport { InsightsService } from '../insights/insights.service';'''
          new = '''import { baseXpForEvent } from '../care-events/reward-policy';\nimport { InsightsService } from '../insights/insights.service';\nimport {\n  deriveAdventureLearningSignals,\n  type AdventureLearningSignals,\n} from './adventure-learning-policy';'''
          if old not in text:
              raise SystemExit('Adventure import anchor not found')
          text = text.replace(old, new, 1)

          old = '''          questKey: quest.key,\n          dogExperience: dto.dogExperience,\n          ownerExperience: dto.ownerExperience,\n          safeOptOut,\n          bondXp: receipt.bondXp,'''
          new = '''          questKey: quest.key,\n          originalPathway: quest.primaryPathway,\n          rewardPathway,\n          dogExperience: dto.dogExperience,\n          ownerExperience: dto.ownerExperience,\n          safeOptOut,\n          bondXp: receipt.bondXp,'''
          if old not in text:
              raise SystemExit('completion interaction context anchor not found')
          text = text.replace(old, new, 1)

          old = '''            questId,\n            pathway: rewardPathway,\n            bondXp: receipt.bondXp,'''
          new = '''            questId,\n            pathway: rewardPathway,\n            originalPathway: quest.primaryPathway,\n            rewardPathway,\n            bondXp: receipt.bondXp,'''
          if old not in text:
              raise SystemExit('Adventure telemetry pathway anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const coverage = new Map(summary.pathways.map((item) => [item.pathway, item.coverage]));\n    const preference = this.preferenceSignals(summary);'''
          new = '''    const coverage = new Map(summary.pathways.map((item) => [item.pathway, item.coverage]));\n    const learning = deriveAdventureLearningSignals(summary.recentEvents);'''
          if old not in text:
              raise SystemExit('buildQuests learning anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '''      const personalRelevance = this.clamp(1 + (preference[pathway] ?? 0), 0.9, 1.08);''',
              '''      const personalRelevance = this.pathwayRelevance(learning, pathway);''',
              1,
          )
          replacements = {
              '''personalRelevance: this.clamp(1 + (preference.EXPLORE ?? 0), 0.9, 1.08),''':
                  '''personalRelevance: this.pathwayRelevance(learning, 'EXPLORE'),''',
              '''personalRelevance: this.clamp(1 + (preference.LEARN ?? 0), 0.9, 1.08),''':
                  '''personalRelevance: this.pathwayRelevance(learning, 'LEARN'),''',
              '''personalRelevance: this.clamp(1 + (preference.RECOVER ?? 0), 0.9, 1.08),''':
                  '''personalRelevance: this.pathwayRelevance(learning, 'RECOVER'),''',
              '''personalRelevance: this.clamp(1 + (preference.BOND ?? 0), 0.9, 1.08),''':
                  '''personalRelevance: this.pathwayRelevance(learning, 'BOND'),''',
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'personal relevance anchor not found: {old_value}')
              text = text.replace(old_value, new_value, 1)

          old = '''  private preferenceSignals(summary: CareSummary) {\n    const signals: Partial<Record<WellbeingPathway, number>> = {};\n    for (const event of summary.recentEvents.slice(0, 10)) {\n      const dog = event.outcome?.dogExperience;\n      const owner = event.outcome?.ownerExperience;\n      const positiveDog = dog === 'loved_it' || dog === 'comfortable';\n      const positiveOwner = owner === 'great' || owner === 'fine';\n      const negative = dog === 'not_their_thing' || owner === 'a_lot_today';\n      const delta = negative ? -0.025 : positiveDog && positiveOwner ? 0.018 : 0;\n      signals[event.pathway] = this.clamp((signals[event.pathway] ?? 0) + delta, -0.1, 0.08);\n    }\n    return signals;\n  }'''
          new = '''  private pathwayRelevance(\n    learning: AdventureLearningSignals,\n    pathway: WellbeingPathway\n  ) {\n    const durable = learning.durablePathwayPreference[pathway] ?? 0;\n    const temporary = learning.temporaryPathwayModifier[pathway] ?? 0;\n    return this.clamp(1 + durable + temporary, 0.9, 1.08);\n  }'''
          if old not in text:
              raise SystemExit('preferenceSignals anchor not found')
          adventure.write_text(text.replace(old, new, 1))

          spec = Path('apps/api/src/adventure/adventure.service.spec.ts')
          text = spec.read_text()
          safe_anchor = '''    expect(careHarness.record).toHaveBeenCalledWith(\n      expect.objectContaining({\n        eventType: 'SAFE_OPT_OUT',\n        pathway: 'BOND',\n        safetyEligible: true,\n      })\n    );\n  });'''
          safe_new = '''    expect(careHarness.record).toHaveBeenCalledWith(\n      expect.objectContaining({\n        eventType: 'SAFE_OPT_OUT',\n        pathway: 'BOND',\n        safetyEligible: true,\n        context: expect.objectContaining({ originalPathway: 'LEARN' }),\n      })\n    );\n    expect(careHarness.recordQuestInteraction).toHaveBeenCalledWith(\n      expect.objectContaining({\n        interaction: 'COMPLETED',\n        pathway: 'BOND',\n        context: expect.objectContaining({ originalPathway: 'LEARN', rewardPathway: 'BOND' }),\n      })\n    );\n    expect(prismaHarness.telemetry.create).toHaveBeenCalledWith(\n      expect.objectContaining({\n        data: expect.objectContaining({\n          data: expect.objectContaining({\n            pathway: 'BOND',\n            originalPathway: 'LEARN',\n            rewardPathway: 'BOND',\n          }),\n        }),\n      })\n    );\n  });'''
          if safe_anchor not in text:
              raise SystemExit('safe opt-out spec anchor not found')
          text = text.replace(safe_anchor, safe_new, 1)

          mismatch_anchor = '''    expect(careHarness.record).toHaveBeenCalledWith(\n      expect.objectContaining({ eventType: 'QUEST_BOND', pathway: 'BOND' })\n    );\n  });'''
          mismatch_new = '''    expect(careHarness.record).toHaveBeenCalledWith(\n      expect.objectContaining({\n        eventType: 'QUEST_BOND',\n        pathway: 'BOND',\n        context: expect.objectContaining({ originalPathway: 'LEARN' }),\n      })\n    );\n    expect(careHarness.recordQuestInteraction).toHaveBeenCalledWith(\n      expect.objectContaining({\n        interaction: 'COMPLETED',\n        pathway: 'BOND',\n        context: expect.objectContaining({ originalPathway: 'LEARN', rewardPathway: 'BOND' }),\n      })\n    );\n  });'''
          if mismatch_anchor not in text:
              raise SystemExit('mismatch spec anchor not found')
          spec.write_text(text.replace(mismatch_anchor, mismatch_new, 1))
          PY
      - name: Format changed TypeScript
        run: >-
          pnpm exec prettier --write
          apps/api/src/care-events/care-event.types.ts
          apps/api/src/care-events/care-events.service.ts
          apps/api/src/adventure/adventure-learning-policy.ts
          apps/api/src/adventure/adventure-learning-policy.spec.ts
          apps/api/src/adventure/adventure.service.ts
          apps/api/src/adventure/adventure.service.spec.ts
      - name: Commit wired learning policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/care-events/care-event.types.ts \
            apps/api/src/care-events/care-events.service.ts \
            apps/api/src/adventure/adventure-learning-policy.ts \
            apps/api/src/adventure/adventure-learning-policy.spec.ts \
            apps/api/src/adventure/adventure.service.ts \
            apps/api/src/adventure/adventure.service.spec.ts
          git commit -m "Wire Adventure learning v2 to canonical outcomes"
          git push origin HEAD:agent/adventure-learning-signals-v2
