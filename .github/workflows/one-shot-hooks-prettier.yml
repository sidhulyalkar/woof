name: One-shot hooks Prettier

on:
  push:
    branches: [agent/woof-adventure-system-v1]
    paths:
      - '.github/workflows/one-shot-hooks-prettier.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/woof-adventure-system-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/lib/api/hooks.ts
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-hooks-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/lib/api/hooks.ts .github/workflows/one-shot-hooks-prettier.yml
          git commit -m "style: format typed web hooks"
          git push origin HEAD:agent/woof-adventure-system-v1
