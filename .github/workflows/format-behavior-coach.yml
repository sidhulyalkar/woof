name: Format behavior coach branch

on:
  push:
    branches: [agent/behavior-coach-ml-trust-v1]

permissions:
  contents: write

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/behavior-coach-ml-trust-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the repository's pinned Prettier
        run: >-
          pnpm exec prettier --write
          apps/api/src/app.module.ts
          apps/api/src/coaching
          apps/api/src/compatibility/compatibility.types.ts
          apps/api/src/ml/ml.service.ts
          apps/api/src/ml/ml.service.spec.ts
          apps/api/test/auth.e2e-spec.ts
          apps/web/src/app/coach/page.tsx
          apps/web/src/app/login/page.tsx
          apps/web/src/components/auth-guard.tsx
          apps/web/src/components/bottom-nav.tsx
          apps/web/src/lib/api-client.ts
          apps/web/src/lib/api/coaching.ts
          apps/web/e2e

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api apps/web
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git commit -m "style: apply pinned prettier to behavior coach"
          git push origin HEAD:agent/behavior-coach-ml-trust-v1
