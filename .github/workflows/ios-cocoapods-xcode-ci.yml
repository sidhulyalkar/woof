name: iOS CocoaPods + Xcode Qualification CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/scripts/audit-ios-cocoapods-build.py'
      - '.github/workflows/ios-cocoapods-xcode-ci.yml'
      - 'docs/IOS_COCOAPODS_XCODE_QUALIFICATION_V1.md'
      - 'docs/IOS_SIMULATOR_ACCESSIBILITY_REALITY_V1.md'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/scripts/audit-ios-cocoapods-build.py'
      - '.github/workflows/ios-cocoapods-xcode-ci.yml'
      - 'docs/IOS_COCOAPODS_XCODE_QUALIFICATION_V1.md'
      - 'docs/IOS_SIMULATOR_ACCESSIBILITY_REALITY_V1.md'

permissions:
  contents: read

concurrency:
  group: ios-cocoapods-xcode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'
  CI: '1'
  WOOF_BUILD_PROFILE: 'production'
  EXPO_PUBLIC_API_URL: 'https://woof-api-prod.fly.dev/api/v1'
  EAS_PROJECT_ID: '00000000-0000-4000-8000-000000000001'

jobs:
  qualify:
    name: Resolve Pods and compile unsigned iOS Simulator app
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Capture Apple toolchain authority
        run: |
          {
            sw_vers
            echo
            xcodebuild -version
            echo
            xcode-select -p
            echo
            pod --version
          } | tee ios-apple-toolchain.txt
          xcode_major=$(xcodebuild -version | awk '/Xcode/{split($2, parts, "."); print parts[1]}')
          if [[ "${xcode_major}" -ne 26 ]]; then
            echo "::error title=Unexpected Xcode authority::Expected Xcode 26.x, received $(xcodebuild -version | head -n 1)"
            exit 1
          fi

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate production-shaped native iOS project
        run: pnpm --filter @woof/mobile exec expo prebuild --clean --platform ios --no-install

      - name: Resolve CocoaPods authority
        working-directory: apps/mobile/ios
        run: |
          pod install --repo-update | tee ../../../ios-pod-install.log
          test -f Podfile.lock
          test -d Woof.xcworkspace

      - name: Inventory Xcode workspace
        working-directory: apps/mobile/ios
        run: >-
          xcodebuild -list -json -workspace Woof.xcworkspace
          | tee ../../../ios-xcode-workspace.json

      - name: Compile Release iOS Simulator app without signing
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Woof.xcworkspace \
            -scheme Woof \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee ../../../ios-xcodebuild.log

      - name: Audit resolved Pods and built app bundle
        run: python3 .github/scripts/audit-ios-cocoapods-build.py

      - name: Select clean available iPhone Simulator
        run: |
          xcrun simctl list devices available -j > ios-simulator-devices.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          data = json.loads(Path('ios-simulator-devices.json').read_text())
          candidates = []
          for runtime, devices in data.get('devices', {}).items():
              match = re.search(r'iOS-(\d+)(?:-(\d+))?', runtime)
              if not match:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              for device in devices:
                  name = device.get('name', '')
                  udid = device.get('udid')
                  if device.get('isAvailable', True) and udid and name.startswith('iPhone'):
                      candidates.append((version, name, udid, runtime))

          if not candidates:
              raise SystemExit('No available iPhone Simulator is installed on the macos-26 runner')

          candidates.sort(key=lambda row: (row[0], row[1]), reverse=True)
          version, name, udid, runtime = candidates[0]
          selection = {
              'name': name,
              'udid': udid,
              'runtime': runtime,
              'runtimeVersion': '.'.join(str(part) for part in version),
          }
          Path('ios-simulator-selection.json').write_text(
              json.dumps(selection, indent=2, sort_keys=True) + '\n'
          )
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'SIMULATOR_UDID={udid}\n')
              handle.write(f'SIMULATOR_NAME={name}\n')
              handle.write(f'SIMULATOR_RUNTIME={runtime}\n')
          print(json.dumps(selection, indent=2, sort_keys=True))
          PY

      - name: Boot clean Simulator and verify Dynamic Type control
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl erase "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" 2>&1 | tee ios-simulator-boot.txt
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee -a ios-simulator-boot.txt
          xcrun simctl help ui 2>&1 | tee ios-simctl-ui-help.txt
          if ! grep -q 'content_size' ios-simctl-ui-help.txt; then
            echo '::error title=Simulator Dynamic Type authority unavailable::simctl ui help does not advertise content_size on this Xcode 26 runner'
            exit 1
          fi

      - name: Install audited Woof app
        run: |
          APP_PATH=$(python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ios-cocoapods-build-report.json').read_text())
          built_app = report.get('builtApp')
          if not built_app:
              raise SystemExit('audited built app path is absent')
          print(built_app)
          PY
          )
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [[ "$BUNDLE_ID" != 'com.woof.app' ]]; then
            echo "::error title=Simulator bundle identity mismatch::Expected com.woof.app, received $BUNDLE_ID"
            exit 1
          fi
          printf 'APP_PATH=%s\n' "$APP_PATH" >> "$GITHUB_ENV"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIMULATOR_UDID" com.woof.app app 2>&1 \
            | tee ios-simulator-installed-container.txt

      - name: Launch baseline Dynamic Type app
        run: |
          xcrun simctl ui "$SIMULATOR_UDID" content_size large
          xcrun simctl ui "$SIMULATOR_UDID" content_size 2>&1 \
            | tee ios-simulator-content-size-baseline.txt
          xcrun simctl launch "$SIMULATOR_UDID" com.woof.app 2>&1 \
            | tee ios-simulator-launch-baseline.txt
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot ios-simulator-baseline.png
          test -s ios-simulator-baseline.png
          xcrun simctl terminate "$SIMULATOR_UDID" com.woof.app

      - name: Launch at largest accessibility Dynamic Type
        run: |
          xcrun simctl ui "$SIMULATOR_UDID" content_size accessibility-extra-extra-extra-large
          xcrun simctl ui "$SIMULATOR_UDID" content_size 2>&1 \
            | tee ios-simulator-content-size-largest.txt
          if cmp -s ios-simulator-content-size-baseline.txt ios-simulator-content-size-largest.txt; then
            echo '::error title=Dynamic Type setting did not change::Baseline and largest content-size reports are identical'
            exit 1
          fi
          xcrun simctl launch "$SIMULATOR_UDID" com.woof.app 2>&1 \
            | tee ios-simulator-launch-largest.txt
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot ios-simulator-largest-dynamic-type.png
          test -s ios-simulator-largest-dynamic-type.png
          xcrun simctl terminate "$SIMULATOR_UDID" com.woof.app
          shasum -a 256 ios-simulator-baseline.png ios-simulator-largest-dynamic-type.png \
            | tee ios-simulator-screenshot-sha256.txt

      - name: Reset and stop Simulator
        if: ${{ always() }}
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl ui "$SIMULATOR_UDID" content_size large >/dev/null 2>&1 || true
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi

      - name: Upload CocoaPods, Xcode and Simulator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-cocoapods-xcode-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ios-apple-toolchain.txt
            ios-pod-install.log
            ios-xcode-workspace.json
            ios-xcodebuild.log
            ios-cocoapods-build-report.json
            ios-simulator-devices.json
            ios-simulator-selection.json
            ios-simulator-boot.txt
            ios-simctl-ui-help.txt
            ios-simulator-installed-container.txt
            ios-simulator-content-size-baseline.txt
            ios-simulator-content-size-largest.txt
            ios-simulator-launch-baseline.txt
            ios-simulator-launch-largest.txt
            ios-simulator-screenshot-sha256.txt
            ios-simulator-baseline.png
            ios-simulator-largest-dynamic-type.png
            apps/mobile/ios/Podfile
            apps/mobile/ios/Podfile.lock
            apps/mobile/ios/Pods/Pods.xcodeproj/project.pbxproj
            apps/mobile/ios/build/DerivedData/Build/Products/*-iphonesimulator/Woof.app/Info.plist
            apps/mobile/ios/build/DerivedData/Build/Products/*-iphonesimulator/Woof.app/PrivacyInfo.xcprivacy
