name: Format dogOS once

on:
  pull_request:
    paths:
      - '.github/workflows/format-dogos-once.yml'

permissions:
  contents: write

jobs:
  format:
    # Same-repository draft PR only. This workflow deletes itself after formatting.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format exact dogOS surfaces
        run: >-
          pnpm exec prettier --write
          apps/api/src/activities/activities.controller.ts
          apps/api/src/activities/activities.service.spec.ts
          apps/api/src/households/households.controller.ts
          apps/api/src/households/households.service.spec.ts
          apps/api/src/households/households.service.ts
          apps/mobile/src/api/activities.ts
          apps/mobile/src/types/activity.ts
          .github/workflows/dogos-foundation-ci.yml

      - name: Remove formatter and commit exact paths
        run: |
          rm .github/workflows/format-dogos-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/activities/activities.controller.ts \
            apps/api/src/activities/activities.service.spec.ts \
            apps/api/src/households/households.controller.ts \
            apps/api/src/households/households.service.spec.ts \
            apps/api/src/households/households.service.ts \
            apps/mobile/src/api/activities.ts \
            apps/mobile/src/types/activity.ts \
            .github/workflows/dogos-foundation-ci.yml \
            .github/workflows/format-dogos-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(dogos): normalize release formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
