name: dogOS Pet Identifier Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/**/dto/**'
      - 'apps/api/src/common/validation/pet-identifier.ts'
      - 'apps/api/src/common/validation/pet-identifier.spec.ts'
      - 'apps/api/src/pets/pets.service.ts'
      - '.github/scripts/assert-pet-identifier-contract.py'
      - '.github/workflows/pet-identifier-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pet-identifier-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: Canonical pet identity on literal head
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.QUALIFIED_SHA }}

      - name: Prove literal qualified checkout
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @woof/database db:generate

      - name: Enforce pet identifier source authority
        run: |
          python -m py_compile .github/scripts/assert-pet-identifier-contract.py
          python .github/scripts/assert-pet-identifier-contract.py

      - name: Prove canonical identifier validation
        run: >-
          pnpm --filter @woof/api exec jest
          src/common/validation/pet-identifier.spec.ts
          src/intelligence/dto/daily-signals.dto.spec.ts
          --runInBand

      - name: Lint and type-check API
        run: |
          pnpm --filter @woof/api lint
          pnpm --filter @woof/api type-check
