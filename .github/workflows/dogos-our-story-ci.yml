name: dogOS Our Story CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/story/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/config/env.validation.ts'
      - 'apps/api/.env.example'
      - 'apps/web/src/app/journey/**'
      - 'apps/web/src/components/bottom-nav.tsx'
      - 'apps/web/src/lib/api/story.ts'
      - 'apps/web/src/lib/api/story.spec.ts'
      - '.github/workflows/dogos-our-story-ci.yml'
      - 'docs/DOGOS_OUR_STORY.md'

permissions:
  contents: read

concurrency:
  group: dogos-our-story-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'
  NEXT_PUBLIC_API_URL: http://127.0.0.1:59999/api/v1

jobs:
  qualify:
    name: Our Story source + curation qualification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woof_test
        options: >-
          --health-cmd "pg_isready -U postgres -d woof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_shadow
      JWT_SECRET: ci-only-story-secret
      NODE_ENV: test
      ML_SERVICE_ENABLED: 'false'
      ENABLE_ADVENTURE_SYSTEM: 'true'
      ENABLE_DOGOS_AUTOPILOT: 'true'
      ENABLE_DOGOS_OUR_STORY: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @woof/database exec prisma validate

      - name: Check Prisma schema formatting
        run: |
          pnpm --filter @woof/database exec prisma format
          git diff --exit-code -- packages/database/prisma/schema.prisma

      - name: Generate Prisma client
        run: pnpm --filter @woof/database db:generate

      - name: Apply inherited migration chain
        run: pnpm --filter @woof/database db:migrate:deploy

      - name: Verify inherited database matches Prisma datamodel
        run: >-
          pnpm --filter @woof/database exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Check Our Story formatting
        run: |
          pnpm exec prettier --write \
            apps/api/src/story \
            apps/api/src/app.module.ts \
            apps/api/src/config/env.validation.ts \
            apps/web/src/app/journey \
            apps/web/src/components/bottom-nav.tsx \
            apps/web/src/lib/api/story.ts \
            apps/web/src/lib/api/story.spec.ts \
            .github/workflows/dogos-our-story-ci.yml \
            docs/DOGOS_OUR_STORY.md
          git diff --exit-code -- \
            apps/api/src/story \
            apps/api/src/app.module.ts \
            apps/api/src/config/env.validation.ts \
            apps/web/src/app/journey \
            apps/web/src/components/bottom-nav.tsx \
            apps/web/src/lib/api/story.ts \
            apps/web/src/lib/api/story.spec.ts \
            .github/workflows/dogos-our-story-ci.yml \
            docs/DOGOS_OUR_STORY.md

      - name: Lint Our Story API surface
        run: >-
          pnpm --filter @woof/api exec eslint --max-warnings=0 --report-unused-disable-directives --format stylish
          'src/story/**/*.ts'
          src/app.module.ts
          src/config/env.validation.ts

      - name: Lint Our Story web surface
        run: >-
          pnpm --filter @woof/web exec eslint --max-warnings=0 --report-unused-disable-directives --format stylish
          src/app/journey/page.tsx
          src/components/bottom-nav.tsx
          src/lib/api/story.ts
          src/lib/api/story.spec.ts

      - name: Reject canonical source mutations from Story
        run: |
          if grep -REin '\.(activity|careEvent|mediaAsset)\.(create|update|delete|upsert|createMany|updateMany|deleteMany)\b|\b(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)[[:space:]]+(activities|care_events|media_assets)\b' apps/api/src/story; then
            echo 'Our Story must reference canonical Activity, CareEvent, and MediaAsset records without mutating them.'
            exit 1
          fi

      - name: Type-check API
        run: pnpm --filter @woof/api type-check

      - name: Type-check web app
        run: pnpm --filter @woof/web type-check

      - name: Run Our Story contracts
        run: pnpm --filter @woof/api exec jest src/story --runInBand

      - name: Run Autopilot replay regression
        run: pnpm --filter @woof/api exec jest src/autopilot/autopilot.service.spec.ts --runInBand

      - name: Run Story web API contract
        run: pnpm --filter @woof/web exec vitest run src/lib/api/story.spec.ts

      - name: Run full web contracts
        run: pnpm --filter @woof/web test

      - name: Build API
        run: pnpm --filter @woof/api build

      - name: Build web app
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
        run: pnpm --filter @woof/web build
