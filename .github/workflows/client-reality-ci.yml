name: dogOS Client Reality CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/scripts/assert-client-reality.py'
      - '.github/scripts/playwright-production-web.sh'
      - '.github/workflows/client-reality-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: client-reality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  contract:
    name: Client authority + matrix contract
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Materialize client-reality formatting
        run: |
          pnpm exec prettier --write \
            apps/web/playwright.config.ts \
            apps/web/src/lib/stores/auth-store.ts \
            apps/web/src/lib/stores/auth-store.test.ts \
            apps/web/src/lib/stores/auth-persist.ts \
            apps/web/src/lib/stores/auth-persist.test.ts \
            apps/web/src/lib/api/client.ts \
            apps/web/src/lib/api/client.test.ts \
            apps/web/src/lib/api/hooks.ts \
            apps/web/src/components/auth-guard.tsx \
            apps/web/src/components/auth-guard.test.tsx \
            apps/web/src/app/health/page.tsx \
            apps/web/src/app/coach/observe/page.tsx \
            apps/web/src/app/coach/observe/history/page.tsx \
            apps/web/src/components/FeedScreen.tsx \
            apps/web/src/components/ProfileScreen.tsx \
            apps/web/src/components/quiz/OnboardingQuiz.tsx \
            apps/web/src/components/feed/CommentSection.tsx \
            apps/web/src/components/feed/CreatePostModal.tsx \
            apps/web/e2e/support/session.ts \
            apps/web/e2e/companion-onramp.spec.ts \
            apps/web/e2e/navigation-spine.spec.ts \
            apps/web/e2e/caregiver-authority.spec.ts \
            apps/web/e2e/trust-discovery.spec.ts \
            apps/web/e2e/release-polish.spec.ts \
            apps/web/e2e/behavior-moments-shadow.spec.ts \
            apps/web/e2e/library-regression.spec.ts \
            .github/workflows/client-reality-ci.yml

      - name: Enforce committed client-reality formatting
        id: formatting-diff
        run: git diff --exit-code

      - name: Upload formatter output on mismatch
        if: failure() && steps.formatting-diff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: client-reality-formatted-${{ github.run_id }}
          path: |
            apps/web/src/components/auth-guard.tsx
            apps/web/src/components/auth-guard.test.tsx
            apps/web/src/app/coach/observe/history/page.tsx
            apps/web/src/components/FeedScreen.tsx
            apps/web/src/components/ProfileScreen.tsx
            apps/web/src/components/feed/CommentSection.tsx
            apps/web/src/components/feed/CreatePostModal.tsx
            apps/web/e2e/support/session.ts
          if-no-files-found: error
          retention-days: 1

      - name: Lint client-reality surface
        run: >-
          pnpm --filter @woof/web exec eslint --max-warnings=0 --report-unused-disable-directives --format stylish
          playwright.config.ts
          src/lib/stores/auth-store.ts
          src/lib/stores/auth-store.test.ts
          src/lib/stores/auth-persist.ts
          src/lib/stores/auth-persist.test.ts
          src/lib/api/client.ts
          src/lib/api/client.test.ts
          src/lib/api/hooks.ts
          src/components/auth-guard.tsx
          src/components/auth-guard.test.tsx
          src/app/health/page.tsx
          src/app/coach/observe/page.tsx
          src/app/coach/observe/history/page.tsx
          src/components/FeedScreen.tsx
          src/components/ProfileScreen.tsx
          src/components/quiz/OnboardingQuiz.tsx
          src/components/feed/CommentSection.tsx
          src/components/feed/CreatePostModal.tsx
          e2e/support/session.ts
          e2e/companion-onramp.spec.ts
          e2e/navigation-spine.spec.ts
          e2e/caregiver-authority.spec.ts
          e2e/trust-discovery.spec.ts
          e2e/release-polish.spec.ts
          e2e/behavior-moments-shadow.spec.ts
          e2e/library-regression.spec.ts

      - name: Validate client-reality source contract
        run: |
          python -m py_compile .github/scripts/assert-client-reality.py
          bash -n .github/scripts/playwright-production-web.sh

      - name: Enforce client-reality source contract
        run: python .github/scripts/assert-client-reality.py

      - name: Type-check web
        run: pnpm --filter @woof/web type-check

      - name: Run canonical auth authority contracts
        run: >-
          pnpm --filter @woof/web exec vitest run
          src/lib/stores/auth-persist.test.ts
          src/lib/stores/auth-store.test.ts
          src/lib/api/client.test.ts
          src/components/auth-guard.test.tsx

  browser-matrix:
    name: Critical path (${{ matrix.slug }})
    needs: contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: desktop-chromium
            project: chromium
            browser: chromium
          - slug: mobile-chromium
            project: 'Mobile Chrome'
            browser: chromium
          - slug: desktop-firefox
            project: firefox
            browser: firefox
          - slug: desktop-webkit
            project: webkit
            browser: webkit

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:59999/api/v1
      PLAYWRIGHT_EXTERNAL_SERVER: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Build Web client for production-server qualification
        run: pnpm --filter @woof/web build

      - name: Install Playwright engine
        run: pnpm --filter @woof/web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Start and prove production Web server
        run: bash .github/scripts/playwright-production-web.sh start

      - name: Run named client critical paths
        run: >-
          pnpm --filter @woof/web exec playwright test
          e2e/auth.spec.ts
          e2e/companion-onramp.spec.ts
          e2e/navigation-spine.spec.ts
          e2e/caregiver-authority.spec.ts
          --project="${{ matrix.project }}"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-reality-${{ matrix.slug }}-${{ github.run_id }}
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production Web log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-reality-web-${{ matrix.slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}/woof-playwright-web.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop production Web server
        if: always()
        run: bash .github/scripts/playwright-production-web.sh stop
