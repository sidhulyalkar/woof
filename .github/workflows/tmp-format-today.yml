name: Temporary Today formatter

on:
  push:
    branches: [agent/tmp-format-today]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/today-action-first-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/app/page.tsx
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- apps/web/src/app/page.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/page.tsx
          git commit -m "Format action-first Today surface"
          git push origin HEAD:agent/today-action-first-v1
