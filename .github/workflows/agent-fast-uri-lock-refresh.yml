name: Temporary fast-uri lock refresh

on:
  push:
    branches:
      - agent/fast-uri-security-v1

permissions:
  contents: write

concurrency:
  group: temporary-fast-uri-lock-refresh
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fast-uri-security-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Refresh lockfile from patched override
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Materialize exact patched graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prove patched fast-uri resolution
        run: |
          grep -F '/fast-uri@3.1.6:' pnpm-lock.yaml
          if grep -F '/fast-uri@3.1.5:' pnpm-lock.yaml; then
            echo 'Vulnerable fast-uri 3.1.5 remains in the lockfile.'
            exit 1
          fi

      - name: Enforce production advisory policy
        run: |
          set +e
          pnpm audit --prod --json > /tmp/pnpm-audit.json
          set -e
          python .github/scripts/assert-pnpm-audit-policy.py /tmp/pnpm-audit.json .github/security-audit-exceptions.json

      - name: Commit canonical lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile was already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Refresh lockfile for patched fast-uri'
          git push origin HEAD:agent/fast-uri-security-v1
