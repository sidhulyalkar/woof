name: One-shot Adventure Prettier

on:
  push:
    branches: [agent/woof-adventure-system-v1]
    paths:
      - '.github/workflows/one-shot-adventure-prettier.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/woof-adventure-system-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format exact release-owned surfaces
        run: >-
          pnpm exec prettier --write
          apps/api/src/config/env.validation.ts
          apps/api/src/common/filters/all-exceptions.filter.ts
          apps/api/src/common/filters/all-exceptions.filter.spec.ts
          apps/api/src/media-library/media-library.service.spec.ts
          apps/api/src/app.controller.ts
          apps/api/src/app.service.ts
          apps/api/src/app.service.spec.ts
          apps/api/src/main.ts
          apps/web/src/app/notifications/page.tsx
          apps/web/src/components/events/EventDetailsDialog.tsx
          apps/web/src/components/matches/MatchDiscoveryScreen.tsx
          apps/web/src/components/onboarding/owner-info-step.tsx
          apps/web/src/components/onboarding/pet-info-step.tsx
          apps/web/src/components/onboarding/quiz-step.tsx
          apps/web/src/components/onboarding/steps/permissions-step.tsx
          apps/web/src/components/onboarding/steps/pet-profile-step.tsx
          apps/web/src/components/onboarding/steps/preferences-step.tsx
          apps/web/src/components/onboarding/steps/user-profile-step.tsx
          apps/web/src/components/quiz/QuizQuestionCard.tsx
          apps/web/src/hooks/use-push-notifications.ts
          apps/web/src/lib/api.ts
          apps/web/src/lib/api/adventure.ts
          apps/web/src/lib/api/behavior-vision.ts
          apps/web/src/lib/api/hooks.ts
          apps/web/src/lib/api/insights.ts
          apps/web/src/lib/api/media-library.ts
          apps/web/src/lib/api/privacy.ts
          apps/web/src/lib/api/profile.ts
          apps/web/src/lib/api/social.ts
          apps/web/src/lib/analytics.ts
          apps/web/src/lib/push-notifications.ts
          apps/web/src/lib/types.ts

      - name: Commit formatted files and self-delete helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-adventure-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/config/env.validation.ts \
            apps/api/src/common/filters/all-exceptions.filter.ts \
            apps/api/src/common/filters/all-exceptions.filter.spec.ts \
            apps/api/src/media-library/media-library.service.spec.ts \
            apps/api/src/app.controller.ts \
            apps/api/src/app.service.ts \
            apps/api/src/app.service.spec.ts \
            apps/api/src/main.ts \
            apps/web/src/app/notifications/page.tsx \
            apps/web/src/components/events/EventDetailsDialog.tsx \
            apps/web/src/components/matches/MatchDiscoveryScreen.tsx \
            apps/web/src/components/onboarding/owner-info-step.tsx \
            apps/web/src/components/onboarding/pet-info-step.tsx \
            apps/web/src/components/onboarding/quiz-step.tsx \
            apps/web/src/components/onboarding/steps/permissions-step.tsx \
            apps/web/src/components/onboarding/steps/pet-profile-step.tsx \
            apps/web/src/components/onboarding/steps/preferences-step.tsx \
            apps/web/src/components/onboarding/steps/user-profile-step.tsx \
            apps/web/src/components/quiz/QuizQuestionCard.tsx \
            apps/web/src/hooks/use-push-notifications.ts \
            apps/web/src/lib/api.ts \
            apps/web/src/lib/api/adventure.ts \
            apps/web/src/lib/api/behavior-vision.ts \
            apps/web/src/lib/api/hooks.ts \
            apps/web/src/lib/api/insights.ts \
            apps/web/src/lib/api/media-library.ts \
            apps/web/src/lib/api/privacy.ts \
            apps/web/src/lib/api/profile.ts \
            apps/web/src/lib/api/social.ts \
            apps/web/src/lib/analytics.ts \
            apps/web/src/lib/push-notifications.ts \
            apps/web/src/lib/types.ts \
            .github/workflows/one-shot-adventure-prettier.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format release-owned surfaces"
          git push origin HEAD:agent/woof-adventure-system-v1
