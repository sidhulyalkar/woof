name: Harden Adventure economy

on:
  push:
    branches: [agent/woof-adventure-system-v1]

permissions:
  contents: write

concurrency:
  group: harden-adventure-economy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/woof-adventure-system-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic economy patches
        run: python scripts/harden-adventure-economy.py

      - name: Format hardened files
        run: >-
          pnpm exec prettier --write
          apps/api/src/care-events/care-events.service.ts
          apps/api/src/adventure/adventure.service.ts
          apps/api/src/adventure/dto/adventure.dto.ts
          apps/api/src/coaching/coaching.controller.ts
          apps/web/.eslintrc.js
          apps/web/src/app/page.tsx
          .github/workflows/adventure-system-ci.yml

      - name: Remove one-run hardening machinery
        run: git rm scripts/harden-adventure-economy.py .github/workflows/publish-adventure-economy-hardening.yml

      - name: Publish hardened redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/care-events/care-events.service.ts \
            apps/api/src/adventure/adventure.service.ts \
            apps/api/src/adventure/dto/adventure.dto.ts \
            apps/api/src/coaching/coaching.controller.ts \
            apps/web/.eslintrc.js \
            apps/web/src/app/page.tsx \
            .github/workflows/adventure-system-ci.yml
          if git diff --cached --quiet; then
            echo "No hardening changes required."
            exit 0
          fi
          git commit -m "fix(adventure): harden reward evidence and concurrent caps"
          git push origin HEAD:agent/woof-adventure-system-v1
