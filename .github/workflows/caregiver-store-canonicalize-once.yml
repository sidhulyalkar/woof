name: Caregiver Store Canonicalize Once

on:
  push:
    branches:
      - agent/caregiver-authority-v1
    paths:
      - '.github/workflows/caregiver-store-canonicalize-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/caregiver-authority-v1
          fetch-depth: 0

      - name: Canonicalize capability scope inside operational store
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/caregiver/caregiver-operational.store.ts')
          text = path.read_text()

          old_import = """  caregiverReceiptHash,\n  type CaregiverCapability,\n"""
          new_import = """  caregiverReceiptHash,\n  normalizeCaregiverCapabilities,\n  type CaregiverCapability,\n"""
          if old_import not in text:
              raise SystemExit('expected caregiver policy import block not found')
          text = text.replace(old_import, new_import, 1)

          old_array = """function capabilityArray(capabilities: readonly CaregiverCapability[]) {\n  return Prisma.sql`ARRAY[${Prisma.join(capabilities)}]::text[]`;\n}\n"""
          new_array = """function capabilityArray(capabilities: readonly CaregiverCapability[]) {\n  const normalized = normalizeCaregiverCapabilities(capabilities);\n  return Prisma.sql`ARRAY[${Prisma.join(normalized)}]::text[]`;\n}\n"""
          if old_array not in text:
              raise SystemExit('expected capabilityArray function not found')
          text = text.replace(old_array, new_array, 1)

          old_tx = """  }) {\n    return this.prisma.$transaction(async (tx) => {\n      const inserted = await tx.$queryRaw<Array<{ id: string }>>(Prisma.sql`\n"""
          new_tx = """  }) {\n    const capabilities = normalizeCaregiverCapabilities(input.capabilities);\n    return this.prisma.$transaction(async (tx) => {\n      const inserted = await tx.$queryRaw<Array<{ id: string }>>(Prisma.sql`\n"""
          if old_tx not in text:
              raise SystemExit('expected issueGrant transaction block not found')
          text = text.replace(old_tx, new_tx, 1)

          text = text.replace('for (const capability of input.capabilities) {', 'for (const capability of capabilities) {', 1)
          text = text.replace('capabilities: input.capabilities,', 'capabilities,', 1)

          path.write_text(text)
          PY

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format patched store
        run: pnpm exec prettier --write apps/api/src/caregiver/caregiver-operational.store.ts

      - name: Commit the narrow store hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/caregiver/caregiver-operational.store.ts
          git commit -m 'fix: canonicalize caregiver capability receipts'
          git push origin HEAD:agent/caregiver-authority-v1
