name: Caregiver Migration Squash Data Only

on:
  push:
    branches:
      - agent/caregiver-authority-v1
    paths:
      - '.github/workflows/caregiver-migration-squash-data-only.yml'

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/caregiver-authority-v1
          fetch-depth: 0

      - name: Consolidate pre-release caregiver migrations only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          feature = Path('packages/database/prisma/migrations/20260829034500_add_dogos_caregiver_authority_v1/migration.sql')
          hardening = Path('packages/database/prisma/migrations/20260829034600_harden_caregiver_issuance_v1/migration.sql')

          base = feature.read_text()
          extra = hardening.read_text()

          legacy_index = """-- A recipient has at most one live invitation/authority relationship for a pet.\n-- Changing the capability set or issuer requires the existing grant to leave the\n-- live state first, preserving an auditable lifecycle rather than mutating scope.\nCREATE UNIQUE INDEX caregiver_grant_one_live_pet_recipient_idx\n  ON dogos_caregiver.grants (pet_id, recipient_user_id)\n  WHERE status IN ('PENDING_ACCEPTANCE', 'ACTIVE');\n\n"""
          if legacy_index not in base:
              raise SystemExit('legacy live-grant index block not found')
          base = base.replace(legacy_index, '', 1)

          prefix = """-- Pre-release hardening for dogOS Caregiver Authority v1.\n-- This migration will be squashed into the feature migration before release.\n\nDROP INDEX IF EXISTS dogos_caregiver.caregiver_grant_one_live_pet_recipient_idx;\n\n"""
          if not extra.startswith(prefix):
              raise SystemExit('unexpected hardening migration prelude')
          extra = extra[len(prefix):]

          feature.write_text(base.rstrip() + '\n\n-- Final v1 authority hardening.\n' + extra.lstrip())
          hardening.unlink()
          PY

      - name: Commit migration-only consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/database/prisma/migrations/20260829034500_add_dogos_caregiver_authority_v1/migration.sql \
            packages/database/prisma/migrations/20260829034600_harden_caregiver_issuance_v1/migration.sql
          git commit -m 'chore: squash caregiver authority migration'
          git push origin HEAD:agent/caregiver-authority-v1
