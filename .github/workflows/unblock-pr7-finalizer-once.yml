name: Unblock PR7 finalizer once

on:
  pull_request:
    paths:
      - '.github/workflows/unblock-pr7-finalizer-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Keep finalizer scoped to existing release gates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-pr7-release-fixes-once.yml')
          text = path.read_text()
          needle = '          pnpm --filter @woof/web type-check\n'
          if text.count(needle) != 1:
            raise SystemExit('Expected exactly one temporary full-web type-check line')
          path.write_text(text.replace(needle, '', 1))
          PY
          rm .github/workflows/unblock-pr7-finalizer-once.yml

      - name: Commit exact workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/finalize-pr7-release-fixes-once.yml \
            .github/workflows/unblock-pr7-finalizer-once.yml
          git commit -m "chore(ci): scope PR7 finalizer to release gates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
