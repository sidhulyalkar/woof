name: Finalize Adventure quest lifecycle

on:
  push:
    branches: [agent/woof-adventure-system-v1]

permissions:
  contents: write

concurrency:
  group: finalize-adventure-quest-lifecycle-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/woof-adventure-system-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic lifecycle patches
        run: python scripts/finalize-quest-lifecycle.py

      - name: Format TypeScript and Prisma schema
        run: |
          pnpm exec prettier --write \
            apps/api/src/care-events/care-events.service.ts \
            apps/api/src/adventure/adventure.service.ts \
            apps/web/src/app/page.tsx
          pnpm --filter @woof/database exec prisma format

      - name: Validate Prisma schema
        run: pnpm --filter @woof/database exec prisma validate

      - name: Remove one-run finalization machinery
        run: git rm scripts/finalize-quest-lifecycle.py .github/workflows/publish-quest-lifecycle-finalization.yml

      - name: Publish lifecycle finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database/prisma/schema.prisma \
            apps/api/src/care-events/care-events.service.ts \
            apps/api/src/adventure/adventure.service.ts \
            apps/web/src/app/page.tsx
          if git diff --cached --quiet; then
            echo "No lifecycle changes required."
            exit 0
          fi
          git commit -m "fix(adventure): preserve selected quests and align Prisma schema"
          git push origin HEAD:agent/woof-adventure-system-v1
