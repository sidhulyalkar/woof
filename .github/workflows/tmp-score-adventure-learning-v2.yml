name: Temporary format Adventure learning v2

on:
  push:
    branches: [agent/tmp-score-adventure-learning-v2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adventure-learning-signals-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Canonicalize complete Adventure learning release surface
        run: >-
          pnpm exec prettier --write
          .github/workflows/dogos-adventure-learning-ci.yml
          docs/DOGOS_ADVENTURE_LEARNING_V2.md
          apps/api/src/adventure/adventure-learning-policy.ts
          apps/api/src/adventure/adventure-learning-policy.spec.ts
          apps/api/src/adventure/adventure-learning-ranking.spec.ts
          apps/api/src/adventure/adventure.service.ts
          apps/api/src/adventure/adventure.service.spec.ts
          apps/api/src/care-events/care-event.types.ts
          apps/api/src/care-events/care-events.service.ts
          apps/api/src/care-events/care-events.integration.spec.ts

      - name: Commit canonical formatting only when needed
        run: |
          if git diff --quiet; then
            echo "Release surface already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/dogos-adventure-learning-ci.yml \
            docs/DOGOS_ADVENTURE_LEARNING_V2.md \
            apps/api/src/adventure/adventure-learning-policy.ts \
            apps/api/src/adventure/adventure-learning-policy.spec.ts \
            apps/api/src/adventure/adventure-learning-ranking.spec.ts \
            apps/api/src/adventure/adventure.service.ts \
            apps/api/src/adventure/adventure.service.spec.ts \
            apps/api/src/care-events/care-event.types.ts \
            apps/api/src/care-events/care-events.service.ts \
            apps/api/src/care-events/care-events.integration.spec.ts
          git commit -m "Format Adventure learning v2 release"
          git push origin HEAD:agent/adventure-learning-signals-v2
