name: One-shot quiz contract repair

on:
  push:
    branches: [agent/woof-adventure-system-v1]
    paths:
      - '.github/workflows/one-shot-quiz-contract-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/woof-adventure-system-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align quiz submission with authenticated API
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/lib/api/hooks.ts')
          text = path.read_text()
          old = """type SubmitQuizInput = {\n  session: QuizSession;\n  featureVector: MLFeatureVector;\n};"""
          new = """type SubmitQuizInput = {\n  session: QuizSession;\n  featureVector: MLFeatureVector;\n};\n\ntype QuizSaveResponse = {\n  id: string;\n  petId: string | null;\n  sessionId: string;\n  completedAt: string;\n};"""
          if old not in text:
              raise SystemExit('SubmitQuizInput block not found')
          text = text.replace(old, new, 1)

          old_mutation = """export function useSubmitQuiz(\n  options?: UseMutationOptions<ExtensibleRecord, Error, SubmitQuizInput>\n) {\n  const queryClient = useQueryClient();\n\n  return useMutation<ExtensibleRecord, Error, SubmitQuizInput>({\n    mutationFn: async (quizSubmission) => {\n      const userId = useSessionStore.getState().user?.id;\n      if (!userId) throw new Error('User not authenticated');\n\n      return apiClient.post<ExtensibleRecord>('/quiz/submit', {\n        ...quizSubmission,\n        userId,\n      });\n    },\n    onSuccess: () => {\n      queryClient.invalidateQueries({\n        queryKey: queryKeys.userProfile(useSessionStore.getState().user?.id ?? ''),\n      });\n    },\n    ...options,\n  });\n}"""
          new_mutation = """export function useSubmitQuiz(\n  options?: UseMutationOptions<QuizSaveResponse, Error, SubmitQuizInput>\n) {\n  const queryClient = useQueryClient();\n\n  return useMutation<QuizSaveResponse, Error, SubmitQuizInput>({\n    mutationFn: async ({ session }) => {\n      const responses = Object.fromEntries(\n        session.responses.map(({ questionId, answer }) => [questionId, answer])\n      );\n\n      return apiClient.post<QuizSaveResponse>('/quiz/responses', {\n        sessionId: session.id,\n        petId: session.petId,\n        responses,\n      });\n    },\n    onSuccess: () => {\n      queryClient.invalidateQueries({\n        queryKey: queryKeys.userProfile(useSessionStore.getState().user?.id ?? ''),\n      });\n    },\n    ...options,\n  });\n}"""
          if old_mutation not in text:
              raise SystemExit('useSubmitQuiz block not found')
          path.write_text(text.replace(old_mutation, new_mutation, 1))
      - run: pnpm exec prettier --write apps/web/src/lib/api/hooks.ts
      - name: Commit repair and self-delete helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-quiz-contract-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/lib/api/hooks.ts .github/workflows/one-shot-quiz-contract-repair.yml
          git commit -m "fix(web): align quiz submission with authenticated API"
          git push origin HEAD:agent/woof-adventure-system-v1
