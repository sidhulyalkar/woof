name: Finish media beta release integration

on:
  push:
    branches: [agent/pet-media-library-v1]

permissions:
  contents: write

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pet-media-library-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install current locked workspace
        run: pnpm install --frozen-lockfile

      - name: Align Expo 54 media dependencies and lockfile
        run: >-
          pnpm --filter @woof/mobile add
          expo-image-picker@~17.0.11
          expo-file-system@~19.0.23
          expo-sharing@~14.0.8

      - name: Apply release integration patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          def patch_all(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # Storage: range sniff + bounded disk streaming for derivatives.
          patch(
              'apps/api/src/storage/storage.service.ts',
              "import * as crypto from 'crypto';\nimport * as path from 'path';\nimport { Readable } from 'stream';",
              "import * as crypto from 'crypto';\nimport { createReadStream, createWriteStream } from 'fs';\nimport { rm, stat } from 'fs/promises';\nimport * as path from 'path';\nimport { Readable } from 'stream';\nimport { pipeline } from 'stream/promises';",
          )
          patch(
              'apps/api/src/storage/storage.service.ts',
              "  async getObjectBytes(key: string, maxBytes = 600 * 1024 * 1024): Promise<Buffer> {",
              r'''  async getObjectHeader(key: string, bytes = 64): Promise<Buffer> {
    const client = this.requireClient();
    const bounded = Math.max(16, Math.min(4096, Math.round(bytes)));
    const response = await client.send(
      new GetObjectCommand({
        Bucket: this.bucket,
        Key: key,
        Range: `bytes=0-${bounded - 1}`,
      }),
    );
    if (!response.Body) throw new ServiceUnavailableException('Media object returned no body');
    const body = response.Body as typeof response.Body & {
      transformToByteArray?: () => Promise<Uint8Array>;
    };
    if (body.transformToByteArray) return Buffer.from(await body.transformToByteArray());
    const chunks: Buffer[] = [];
    let total = 0;
    for await (const chunk of response.Body as AsyncIterable<Uint8Array>) {
      total += chunk.byteLength;
      if (total > bounded) break;
      chunks.push(Buffer.from(chunk));
    }
    return Buffer.concat(chunks).subarray(0, bounded);
  }

  async downloadObjectToFile(key: string, destination: string, maxBytes: number): Promise<number> {
    const client = this.requireClient();
    const response = await client.send(new GetObjectCommand({ Bucket: this.bucket, Key: key }));
    const declared = Number(response.ContentLength ?? 0);
    if (declared > maxBytes) throw new ServiceUnavailableException('Media object exceeds processing limit');
    if (!response.Body) throw new ServiceUnavailableException('Media object returned no body');
    try {
      await pipeline(
        Readable.from(response.Body as AsyncIterable<Uint8Array>),
        createWriteStream(destination, { flags: 'wx' }),
      );
      const info = await stat(destination);
      if (info.size <= 0 || info.size > maxBytes) {
        throw new ServiceUnavailableException('Downloaded media exceeded processing bounds');
      }
      return info.size;
    } catch (error) {
      await rm(destination, { force: true }).catch(() => undefined);
      throw error;
    }
  }

  async uploadPrivateFilePath(input: {
    filePath: string;
    filename: string;
    contentType: string;
    folder?: string;
  }): Promise<PrivateUploadResult> {
    const client = this.requireClient();
    const info = await stat(input.filePath);
    if (!info.isFile() || info.size <= 0) {
      throw new ServiceUnavailableException('Derivative output was not a readable file');
    }
    const key = this.generateKey(input.filename, input.folder ?? 'private/derivatives');
    await client.send(
      new PutObjectCommand({
        Bucket: this.bucket,
        Key: key,
        Body: createReadStream(input.filePath),
        ContentLength: info.size,
        ContentType: input.contentType,
        Metadata: { generated: 'true', size: String(info.size) },
      }),
    );
    return { key, bucket: this.bucket };
  }

  async getObjectBytes(key: string, maxBytes = 600 * 1024 * 1024): Promise<Buffer> {''',
          )

          # Schedule the worker once globally.
          patch(
              'apps/api/src/app.module.ts',
              "import { ThrottlerGuard, ThrottlerModule, type ThrottlerModuleOptions } from '@nestjs/throttler';",
              "import { ThrottlerGuard, ThrottlerModule, type ThrottlerModuleOptions } from '@nestjs/throttler';\nimport { ScheduleModule } from '@nestjs/schedule';",
          )
          patch(
              'apps/api/src/app.module.ts',
              '    ThrottlerModule.forRoot(throttlerOptions),\n    PrismaModule,',
              '    ThrottlerModule.forRoot(throttlerOptions),\n    ScheduleModule.forRoot(),\n    PrismaModule,',
          )

          patch(
              'apps/api/src/media-library/media-library.module.ts',
              "import { MediaLibraryController } from './media-library.controller';",
              "import { MediaLibraryController } from './media-library.controller';\nimport { MediaDerivativeWorkerService } from './media-derivative.worker';",
          )
          patch(
              'apps/api/src/media-library/media-library.module.ts',
              '  providers: [MediaLibraryService],',
              '  providers: [MediaLibraryService, MediaDerivativeWorkerService],',
          )

          # Production configuration for derivative tooling.
          patch(
              'apps/api/src/config/env.validation.ts',
              "  MEDIA_LIBRARY_USER_QUOTA_BYTES: z.coerce.number().int().min(100 * 1024 * 1024).max(1024 * 1024 * 1024 * 1024).optional(),",
              "  MEDIA_LIBRARY_USER_QUOTA_BYTES: z.coerce.number().int().min(100 * 1024 * 1024).max(1024 * 1024 * 1024 * 1024).optional(),\n  MEDIA_DERIVATIVES_ENABLED: z.enum(['true', 'false']).default('false'),\n  MEDIA_FFMPEG_PATH: z.string().default('ffmpeg'),\n  MEDIA_FFPROBE_PATH: z.string().default('ffprobe'),",
          )
          patch(
              'apps/api/.env.example',
              'MEDIA_LIBRARY_USER_QUOTA_BYTES=10737418240\n',
              'MEDIA_LIBRARY_USER_QUOTA_BYTES=10737418240\n\n# Private derivative worker. Production images should install ffmpeg + ffprobe.\n# Originals remain immutable; thumbnails/posters/previews strip embedded metadata.\nMEDIA_DERIVATIVES_ENABLED=false\nMEDIA_FFMPEG_PATH=ffmpeg\nMEDIA_FFPROBE_PATH=ffprobe\n',
          )

          # Immediate signature check plus derivative-aware library responses.
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "import { StorageService } from '../storage/storage.service';",
              "import { StorageService } from '../storage/storage.service';\nimport { declaredMimeMatches, sniffMediaType } from './media-sniff';",
          )
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "  albumLinks?: Array<{ albumId: string }>;\n};",
              "  albumLinks?: Array<{ albumId: string }>;\n  derivatives?: Array<{ kind: string; storageKey: string; status: string }>;\n};",
          )
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "    const sizeMatches = object.sizeBytes === Number(asset.sizeBytes);\n    const contentTypeMatches = !object.contentType || object.contentType === asset.mimeType;\n    if (!sizeMatches || !contentTypeMatches) {",
              "    const sizeMatches = object.sizeBytes === Number(asset.sizeBytes);\n    const contentTypeMatches = !object.contentType || object.contentType === asset.mimeType;\n    const signatureMatches = await this.storage\n      .getObjectHeader(asset.storageKey, 64)\n      .then((header) => declaredMimeMatches(sniffMediaType(header), asset.mimeType))\n      .catch(() => false);\n    if (!sizeMatches || !contentTypeMatches || !signatureMatches) {",
          )
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "      throw new BadRequestException('Uploaded media did not match the declared size or content type');",
              "      throw new BadRequestException('Uploaded media did not match the declared size, type, or file signature');",
          )
          derivative_include = "include: {\n        albumLinks: { select: { albumId: true } },\n        derivatives: {\n          where: { status: 'READY' },\n          select: { kind: true, storageKey: true, status: true },\n        },\n      },"
          patch_all(
              'apps/api/src/media-library/media-library.service.ts',
              "include: { albumLinks: { select: { albumId: true } } },",
              derivative_include,
          )
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "    const asset = await this.requireAsset(userId, assetId);\n    await this.storage.deleteFile(asset.storageKey);\n    await this.prisma.mediaAsset.delete({ where: { id: asset.id } });",
              "    const asset = await this.requireAsset(userId, assetId);\n    const derivatives = await this.prisma.mediaDerivative.findMany({\n      where: { assetId: asset.id },\n      select: { storageKey: true, status: true },\n    });\n    for (const derivative of derivatives) {\n      if (derivative.status === 'READY' && !derivative.storageKey.startsWith('pending/')) {\n        await this.storage.deleteFile(derivative.storageKey).catch(() => undefined);\n      }\n    }\n    await this.storage.deleteFile(asset.storageKey);\n    await this.prisma.mediaAsset.delete({ where: { id: asset.id } });",
          )
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "    const tags = this.parseTags(asset.tags);\n    const smart = this.toSmartAsset(asset);",
              "    const derivativeEntries = await Promise.all(\n      (asset.derivatives ?? []).map(async (derivative) => [\n        derivative.kind,\n        await this.storage.getSignedUrl(derivative.storageKey, 900).catch(() => null),\n      ] as const),\n    );\n    const derivativeUrls = Object.fromEntries(derivativeEntries) as Record<string, string | null>;\n    const tags = this.parseTags(asset.tags);\n    const smart = this.toSmartAsset(asset);",
          )
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "      url,\n      urlExpiresInSeconds: url ? 900 : null,\n      status: asset.status,",
              "      url,\n      thumbnailUrl: derivativeUrls.THUMBNAIL ?? null,\n      posterUrl: derivativeUrls.POSTER ?? null,\n      previewUrl: derivativeUrls.PREVIEW ?? null,\n      urlExpiresInSeconds: url ? 900 : null,\n      status: asset.status,",
          )
          patch(
              'apps/api/src/media-library/media-library.service.ts',
              "      include: includeAlbums ? { albumLinks: { select: { albumId: true } } } : undefined,",
              "      include: includeAlbums\n        ? {\n            albumLinks: { select: { albumId: true } },\n            derivatives: {\n              where: { status: 'READY' },\n              select: { kind: true, storageKey: true, status: true },\n            },\n          }\n        : undefined,",
          )
          patch(
              'apps/api/src/media-library/media-library.types.ts',
              "  status: 'PENDING' | 'READY' | 'FAILED' | 'DELETED';",
              "  status: 'PENDING' | 'READY' | 'FAILED' | 'QUARANTINED' | 'DELETED';",
          )

          # Web media API understands private derivatives.
          patch(
              'apps/web/src/lib/api/media-library.ts',
              "  url: string | null;\n  urlExpiresInSeconds: number | null;",
              "  url: string | null;\n  thumbnailUrl?: string | null;\n  posterUrl?: string | null;\n  previewUrl?: string | null;\n  urlExpiresInSeconds: number | null;",
          )

          # Keep legacy session consumers synchronized with the canonical auth store.
          patch(
              'apps/web/src/lib/api.ts',
              "import { useAuthStore } from './stores/auth-store';",
              "import { useAuthStore } from './stores/auth-store';\nimport { useSessionStore } from '../store/session';",
          )
          patch_all(
              'apps/web/src/lib/api.ts',
              "      useAuthStore.getState().setAuth(response.user, response.access_token);",
              "      useAuthStore.getState().setAuth(response.user, response.access_token);\n      useSessionStore.getState().setSession(response.user, response.access_token);",
          )
          patch(
              'apps/web/src/lib/api.ts',
              "  logout: () => {\n    useAuthStore.getState().logout();\n  },",
              "  logout: () => {\n    useAuthStore.getState().logout();\n    useSessionStore.getState().clearSession();\n  },",
          )
          patch(
              'apps/web/src/lib/api.ts',
              "  me: () => apiClient.get('/auth/me'),",
              "  me: async () => {\n    const user = await apiClient.get('/auth/me');\n    const token = typeof window !== 'undefined' ? localStorage.getItem('authToken') : null;\n    if (token) useSessionStore.getState().setSession(user, token);\n    return user;\n  },",
          )

          # Explicit post-analysis keep-original controls.
          patch(
              'apps/web/src/app/coach/observe/page.tsx',
              "import { BottomNav } from '@/components/bottom-nav';",
              "import { BottomNav } from '@/components/bottom-nav';\nimport { KeepMediaButton } from '@/components/keep-media-button';",
          )
          patch(
              'apps/web/src/app/coach/observe/page.tsx',
              "            {result.observationId && (\n              <div className=\"border-t border-border/60 pt-4\">",
              "            {media && (\n              <KeepMediaButton\n                petId={petId}\n                media={media}\n                source=\"behavior-vision\"\n                linkedObservationId={result.observationId}\n                tags={['behavior', context, phase]}\n              />\n            )}\n\n            {result.observationId && (\n              <div className=\"border-t border-border/60 pt-4\">",
          )
          patch(
              'apps/web/src/app/health/page.tsx',
              "import { BottomNav } from '@/components/bottom-nav';",
              "import { BottomNav } from '@/components/bottom-nav';\nimport { KeepMediaButton } from '@/components/keep-media-button';",
          )
          patch(
              'apps/web/src/app/health/page.tsx',
              "            <AssessmentDetails assessment={result.assessment} />\n            {result.assessment.questions.length > 0 && (",
              "            <AssessmentDetails assessment={result.assessment} />\n            {image && result.assessment.triage !== 'emergency_now' && (\n              <div className=\"mt-4\">\n                <KeepMediaButton\n                  petId={petId}\n                  media={image}\n                  source=\"health-lens\"\n                  linkedObservationId={result.assessmentId}\n                  tags={['health', bodyArea]}\n                />\n              </div>\n            )}\n            {result.assessment.questions.length > 0 && (",
          )

          # Library states, derivative previews, and deterministic test hooks.
          patch(
              'apps/web/src/app/library/page.tsx',
              '<div className="min-h-screen bg-background pb-28">',
              '<div data-testid="media-library-root" className="min-h-screen bg-background pb-28">',
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              "        {notice && (\n          <div role=\"status\" className=\"rounded-2xl border border-primary/15 bg-primary/[0.055] px-4 py-3 text-sm\">\n            {notice}\n          </div>\n        )}",
              "        {notice && (\n          <div role=\"status\" className=\"rounded-2xl border border-primary/15 bg-primary/[0.055] px-4 py-3 text-sm\">\n            {notice}\n          </div>\n        )}\n\n        {uploadMutation.isPending && (\n          <div data-testid=\"media-library-uploading\" role=\"status\" aria-live=\"polite\" className=\"flex items-center gap-2 rounded-2xl border border-primary/15 bg-primary/[0.04] px-4 py-3 text-sm\">\n            <Loader2 className=\"h-4 w-4 animate-spin text-primary\" aria-hidden=\"true\" />\n            Saving selected originals privately…\n          </div>\n        )}\n\n        {uploadMutation.isError && (\n          <div role=\"alert\" className=\"rounded-2xl border border-destructive/25 bg-destructive/[0.05] px-4 py-3 text-sm\">\n            {uploadMutation.error instanceof Error ? uploadMutation.error.message : 'One or more originals could not be saved.'}\n          </div>\n        )}",
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              '<section>\n          <div className="mb-3 flex items-center justify-between gap-3">',
              '<section data-testid="media-library-albums">\n          <div className="mb-3 flex items-center justify-between gap-3">',
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              "            {selectedIds.length > 0 && (\n              <div className=\"flex flex-wrap justify-end gap-2\">",
              "            {selectedIds.length > 0 && (\n              <div className=\"flex flex-wrap items-center justify-end gap-2\">\n                <span className=\"text-xs font-semibold text-muted-foreground\">{selectedIds.length} selected</span>",
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              "        {libraryQuery.isLoading ? (",
              "        {libraryQuery.isError ? (\n          <section data-testid=\"media-library-error\" className=\"rounded-3xl border border-destructive/20 bg-destructive/[0.04] p-8 text-center\">\n            <h2 className=\"font-semibold\">Couldn’t open your private library</h2>\n            <p className=\"mx-auto mt-2 max-w-sm text-sm text-muted-foreground\">\n              Your originals are still private. Check your connection and try loading the library again.\n            </p>\n            <Button type=\"button\" variant=\"outline\" className=\"mt-4\" onClick={() => void libraryQuery.refetch()}>Try again</Button>\n          </section>\n        ) : libraryQuery.isLoading ? (",
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              '<section className="rounded-3xl border border-dashed border-border p-10 text-center">',
              '<section data-testid="media-library-empty" className="rounded-3xl border border-dashed border-border p-10 text-center">',
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              '<section className="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4">',
              '<section data-testid="media-library-grid" className="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4">',
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              "                    aria-label={selected ? `Deselect ${asset.filename}` : `Select ${asset.filename}`}\n                    className={cn(",
              "                    aria-label={selected ? `Deselect ${asset.filename}` : `Select ${asset.filename}`}\n                    data-asset-id={asset.id}\n                    className={cn(",
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              "                    {asset.mediaType === 'video' && asset.url ? (\n                      <video\n                        src={asset.url}",
              "                    {asset.mediaType === 'video' && (asset.previewUrl || asset.url) ? (\n                      <video\n                        src={asset.previewUrl ?? asset.url ?? undefined}",
          )
          patch(
              'apps/web/src/app/library/page.tsx',
              "                        style={asset.url ? { backgroundImage: `url(${JSON.stringify(asset.url).slice(1, -1)})` } : undefined}",
              "                        style={(asset.thumbnailUrl ?? asset.posterUrl ?? asset.url) ? { backgroundImage: `url(${JSON.stringify(asset.thumbnailUrl ?? asset.posterUrl ?? asset.url).slice(1, -1)})` } : undefined}",
          )

          # iOS picker remains selected-only; remove Expo's default Android audio permission.
          import json
          app_path = Path('apps/mobile/app.json')
          app = json.loads(app_path.read_text())
          app['expo']['ios']['infoPlist']['NSPhotoLibraryUsageDescription'] = (
              'Woof accesses only photos and videos you explicitly choose for your private pet library.'
          )
          for plugin in app['expo'].get('plugins', []):
              if isinstance(plugin, list) and plugin and plugin[0] == 'expo-image-picker':
                  plugin[1]['photosPermission'] = 'Allow Woof to use only photos and videos you explicitly select.'
                  plugin[1]['microphonePermission'] = False
          app_path.write_text(json.dumps(app, indent=2) + '\n')
          PY

      - name: Apply pinned formatting
        run: >-
          pnpm exec prettier --write
          apps/api/src/storage/storage.service.ts
          apps/api/src/app.module.ts
          apps/api/src/config/env.validation.ts
          apps/api/src/media-library
          apps/api/.env.example
          apps/web/src/lib/api.ts
          apps/web/src/lib/api/media-library.ts
          apps/web/src/components/keep-media-button.tsx
          apps/web/src/app/coach/observe/page.tsx
          apps/web/src/app/health/page.tsx
          apps/web/src/app/library/page.tsx
          apps/web/e2e/library-regression.spec.ts
          apps/mobile/src/api/media-library.ts
          apps/mobile/src/media/apple-media-adapter.ts
          apps/mobile/src/screens/MediaLibraryScreen.tsx
          apps/mobile/src/navigation/AppNavigator.tsx
          apps/mobile/app.json
          .github/workflows/media-library-branch-ci.yml

      - name: Validate generated Prisma client and targeted tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_test
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woof_test
          JWT_SECRET: ci-only-test-secret
          NODE_ENV: test
        run: |
          pnpm --filter @woof/database db:generate
          pnpm --filter @woof/api exec jest src/media-library --runInBand
          pnpm --filter @woof/api build
          pnpm --filter @woof/web build
          pnpm --filter @woof/mobile type-check

      - name: Commit integrated release pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps packages .github/workflows/media-library-branch-ci.yml
          if git diff --cached --quiet; then
            echo "No release integration changes required."
            exit 0
          fi
          git commit -m "feat(media): finish beta media privacy, derivatives, tests, and Apple adapters"
          git push origin HEAD:agent/pet-media-library-v1
