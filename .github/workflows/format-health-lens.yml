name: Format Health Lens branch

on:
  push:
    branches: [agent/pet-health-lens-v1]

permissions:
  contents: write

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pet-health-lens-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pinned Prettier
        run: >-
          pnpm exec prettier --write
          apps/api/src/app.module.ts
          apps/api/src/config/env.validation.ts
          apps/api/src/health-lens
          apps/web/src/app/health/page.tsx
          apps/web/src/components/bottom-nav.tsx
          apps/web/src/lib/api/health-lens.ts
          packages/ui/package.json

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api apps/web packages/ui/package.json
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git commit -m "style: apply pinned prettier to Health Lens"
          git push origin HEAD:agent/pet-health-lens-v1
