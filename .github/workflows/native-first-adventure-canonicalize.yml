name: Native First Adventure Canonicalize

on:
  push:
    branches: [agent/native-first-adventure-canonicalize-v1]
    paths:
      - '.github/workflows/native-first-adventure-canonicalize.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/native-first-adventure-canonicalize-v1

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Canonicalize mobile source
        run: |
          pnpm exec prettier --write \
            apps/mobile/src/api/auth.ts \
            apps/mobile/src/api/adaptive-profile.ts \
            apps/mobile/src/api/companion.ts \
            apps/mobile/src/api/pets.ts \
            apps/mobile/src/navigation/AppNavigator.tsx \
            apps/mobile/src/onboarding/first-adventure.ts \
            apps/mobile/src/onboarding/recovery.ts \
            apps/mobile/src/screens/CompanionHomeScreen.tsx \
            apps/mobile/src/screens/CompanionModeScreen.tsx \
            apps/mobile/src/screens/FirstAdventureScreen.tsx
          pnpm --filter @woof/mobile exec expo lint --fix

      - name: Verify canonical mobile source
        run: |
          python3 .github/scripts/assert-native-first-adventure.py
          pnpm --filter @woof/mobile type-check
          pnpm --filter @woof/mobile lint
          pnpm exec prettier --check \
            apps/mobile/src/api/auth.ts \
            apps/mobile/src/api/adaptive-profile.ts \
            apps/mobile/src/api/companion.ts \
            apps/mobile/src/api/pets.ts \
            apps/mobile/src/navigation/AppNavigator.tsx \
            apps/mobile/src/onboarding/first-adventure.ts \
            apps/mobile/src/onboarding/recovery.ts \
            apps/mobile/src/screens/CompanionHomeScreen.tsx \
            apps/mobile/src/screens/CompanionModeScreen.tsx \
            apps/mobile/src/screens/FirstAdventureScreen.tsx

      - name: Commit canonical mobile source
        run: |
          git config user.name 'woof-ci'
          git config user.email 'woof-ci@users.noreply.github.com'
          git add apps/mobile
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Mobile source already canonical.'
            exit 0
          fi
          git commit -m 'Canonicalize native First Adventure mobile source'
          git push origin HEAD:agent/native-first-adventure-canonicalize-v1
