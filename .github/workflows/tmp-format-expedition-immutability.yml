name: Temporary Expedition Immutability Formatter

on:
  push:
    branches:
      - agent/expedition-authority-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Canonicalize exactly one Expedition integration file
        run: pnpm exec prettier --write apps/api/src/expeditions/expeditions.integration.spec.ts
      - name: Commit exactly the canonical formatting delta
        run: |
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Expedition integration test already canonical.'
            exit 0
          fi
          if [[ "$changed" != 'apps/api/src/expeditions/expeditions.integration.spec.ts' ]]; then
            echo "Unexpected files changed:"
            echo "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/expeditions/expeditions.integration.spec.ts
          git commit -m 'Format Expedition immutability contract'
          git fetch origin agent/expedition-authority-v1
          git rebase origin/agent/expedition-authority-v1
          git push origin HEAD:agent/expedition-authority-v1
