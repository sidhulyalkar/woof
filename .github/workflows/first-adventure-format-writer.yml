name: materialize First Adventure formatting

on:
  push:
    branches:
      - agent/relationship-first-first-adventure-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/relationship-first-first-adventure-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Canonically format First Adventure surface
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/onboarding/page.tsx \
            apps/web/src/components/onboarding/first-adventure-step.tsx \
            apps/web/src/components/onboarding/pet-info-step.tsx \
            apps/web/src/lib/onboarding/first-adventure.spec.ts

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/app/onboarding/page.tsx \
            apps/web/src/components/onboarding/first-adventure-step.tsx \
            apps/web/src/components/onboarding/pet-info-step.tsx \
            apps/web/src/lib/onboarding/first-adventure.spec.ts
          git commit -m 'style(onboarding): apply canonical formatting'
          git push origin HEAD:agent/relationship-first-first-adventure-v1
