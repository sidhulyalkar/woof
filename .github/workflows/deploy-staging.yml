name: Deploy to Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-api-staging:
    name: Deploy API to Staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate staging API deployment credentials
        run: |
          if [[ -z "${FLY_API_TOKEN}" ]]; then
            echo "::error title=Missing staging secret::FLY_API_TOKEN is not configured for the staging environment. Add a Fly deploy token before rerunning this workflow."
            exit 1
          fi

      - name: Install pinned Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.76

      - name: Deploy API with migration, release identity and readiness gates
        run: >-
          flyctl deploy .
          --remote-only
          --app woof-api-staging
          --config apps/api/fly.toml
          --build-arg WOOF_RELEASE_SHA="${GITHUB_SHA}"

      - name: Capture liveness and readiness evidence
        id: release_bodies
        run: |
          live=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 \
            https://woof-api-staging.fly.dev/api/v1/ops/health/live)
          ready=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 \
            https://woof-api-staging.fly.dev/api/v1/ops/health/ready)
          {
            echo 'live<<EOF'
            echo "$live"
            echo EOF
            echo 'ready<<EOF'
            echo "$ready"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Enforce deployed API release identity
        env:
          LIVE_BODY: ${{ steps.release_bodies.outputs.live }}
          READY_BODY: ${{ steps.release_bodies.outputs.ready }}
        run: |
          node - <<'NODE'
          const expected = process.env.GITHUB_SHA;
          for (const [name, raw] of Object.entries({ live: process.env.LIVE_BODY, ready: process.env.READY_BODY })) {
            const parsed = JSON.parse(raw);
            if (parsed.release !== expected) {
              throw new Error(`${name} release mismatch: expected ${expected}, received ${parsed.release}`);
            }
          }
          NODE

  deploy-web-staging:
    name: Deploy Web to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: deploy-api-staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EXPECTED_API_URL: https://woof-api-staging.fly.dev/api/v1
    steps:
      - uses: actions/checkout@v7

      - name: Validate staging Web deployment credentials
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing staging secret::${name} is not configured for the staging environment."
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
        working-directory: apps/web

      - name: Build Project Artifacts
        run: vercel build --token="${VERCEL_TOKEN}"
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.EXPECTED_API_URL }}
          NEXT_PUBLIC_WOOF_RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_REPLAY_ENABLED: 'false'

      - name: Deploy to Vercel
        id: deploy_web
        working-directory: apps/web
        run: |
          deployment_url=$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}" | tail -n 1 | tr -d '\r')
          if [[ ! "${deployment_url}" =~ ^https:// ]]; then
            echo "::error title=Invalid Vercel deployment URL::Expected an HTTPS deployment URL, received '${deployment_url}'."
            exit 1
          fi
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Web release and API integration
        env:
          WEB_URL: ${{ steps.deploy_web.outputs.url }}
        run: |
          html=$(curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            "${WEB_URL}/demo")
          WEB_HTML="$html" node - <<'NODE'
          const html = process.env.WEB_HTML || '';
          const expectedRelease = process.env.GITHUB_SHA;
          const expectedApi = process.env.EXPECTED_API_URL;

          function meta(name) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const match = html.match(new RegExp(`<meta[^>]*name=["']${escaped}["'][^>]*content=["']([^"']+)["']`, 'i'));
            return match?.[1] ?? null;
          }

          const release = meta('woof-release');
          const apiOrigin = meta('woof-api-origin');
          if (release !== expectedRelease) {
            throw new Error(`Web release mismatch: expected ${expectedRelease}, received ${release}`);
          }
          if (apiOrigin !== expectedApi) {
            throw new Error(`Web API origin mismatch: expected ${expectedApi}, received ${apiOrigin}`);
          }
          NODE
