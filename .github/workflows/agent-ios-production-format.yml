name: Temporary iOS production config formatting

on:
  push:
    branches:
      - agent/ios-production-config-v1

permissions:
  contents: write

concurrency:
  group: temporary-ios-production-config-format
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ios-production-config-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier output
        run: >-
          pnpm exec prettier --write
          apps/mobile/app.json
          apps/mobile/app.config.ts
          apps/mobile/src/api/client.ts

      - name: Verify semantic source contract after formatting
        run: python3 .github/scripts/assert-ios-production-config.py

      - name: Commit exact toolchain output
        run: |
          if git diff --quiet -- \
            apps/mobile/app.json \
            apps/mobile/app.config.ts \
            apps/mobile/src/api/client.ts
          then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mobile/app.json \
            apps/mobile/app.config.ts \
            apps/mobile/src/api/client.ts
          git commit -m 'Canonicalize iOS production config'
          git push origin HEAD:agent/ios-production-config-v1
