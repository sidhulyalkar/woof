name: Temporary Native Canonical Autofix

on:
  push:
    branches:
      - agent/ios-dogos-convergence-v1

permissions:
  contents: write

concurrency:
  group: temporary-native-autofix
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '8.15.1'

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ios-dogos-convergence-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply repository-pinned native fixes
        run: |
          pnpm exec prettier --write \
            apps/mobile/src/api/adventure.ts \
            apps/mobile/src/api/households.ts \
            apps/mobile/src/api/intelligence.ts \
            apps/mobile/src/api/story.ts \
            apps/mobile/src/navigation/AppNavigator.tsx \
            apps/mobile/src/screens/TodayScreen.tsx \
            apps/mobile/src/screens/CompassScreen.tsx \
            apps/mobile/src/screens/StoryScreen.tsx \
            apps/mobile/src/screens/DailySignalsScreen.tsx \
            apps/mobile/src/screens/FeedScreen.tsx \
            apps/mobile/src/screens/ProfileScreen.tsx \
            apps/mobile/README.md \
            docs/IOS_DOGOS_CONVERGENCE_V1.md \
            .github/workflows/dogos-mobile-convergence-ci.yml
          pnpm --filter @woof/mobile exec eslint \
            src/screens/TodayScreen.tsx \
            src/screens/DailySignalsScreen.tsx \
            --fix
          pnpm exec prettier --write \
            apps/mobile/src/screens/TodayScreen.tsx \
            apps/mobile/src/screens/DailySignalsScreen.tsx

      - name: Prove canonicalized native client
        run: |
          pnpm --filter @woof/mobile type-check
          pnpm --filter @woof/mobile lint
          python3 .github/scripts/assert-mobile-dogos-convergence.py

      - name: Commit exact toolchain output
        run: |
          if git diff --quiet; then
            echo 'No canonical changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mobile/src/api/adventure.ts \
            apps/mobile/src/api/households.ts \
            apps/mobile/src/api/intelligence.ts \
            apps/mobile/src/api/story.ts \
            apps/mobile/src/navigation/AppNavigator.tsx \
            apps/mobile/src/screens/TodayScreen.tsx \
            apps/mobile/src/screens/CompassScreen.tsx \
            apps/mobile/src/screens/StoryScreen.tsx \
            apps/mobile/src/screens/DailySignalsScreen.tsx \
            apps/mobile/src/screens/FeedScreen.tsx \
            apps/mobile/src/screens/ProfileScreen.tsx \
            apps/mobile/README.md \
            docs/IOS_DOGOS_CONVERGENCE_V1.md \
            .github/workflows/dogos-mobile-convergence-ci.yml
          git commit -m 'Canonicalize native convergence tranche'
          git push origin HEAD:agent/ios-dogos-convergence-v1
