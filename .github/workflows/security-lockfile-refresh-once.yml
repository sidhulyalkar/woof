name: Security Lockfile Refresh Once

on:
  push:
    branches:
      - agent/repository-security-baseline-v1
    paths:
      - '.github/workflows/security-lockfile-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/repository-security-baseline-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Resolve exact patched dependency graph
        run: pnpm install --lockfile-only

      - name: Commit lockfile only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already matches package constraints.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'security: refresh lockfile for patched dependencies'
          git push origin HEAD:agent/repository-security-baseline-v1
