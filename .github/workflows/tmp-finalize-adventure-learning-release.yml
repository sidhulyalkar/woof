name: Temporary finalize Adventure learning source contracts

on:
  push:
    branches: [agent/tmp-finalize-adventure-learning-release]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adventure-learning-signals-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Finalize bounded Adventure learning evidence limit
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/care-events/care-events.service.ts')
          text = service.read_text()
          old = '''    await this.households.assertPetAccessible(userId, petId);\n    const boundedLimit = Math.max(1, Math.min(24, Math.round(limit)));'''
          new = '''    await this.households.assertPetAccessible(userId, petId);\n    const requestedLimit = Number.isFinite(limit) ? Math.round(limit) : 24;\n    const boundedLimit = Math.max(1, Math.min(24, requestedLimit));'''
          if old not in text:
              raise SystemExit('missing bounded learning limit anchor')
          service.write_text(text.replace(old, new, 1))

          spec = Path('apps/api/src/care-events/care-events.integration.spec.ts')
          text = spec.read_text()
          old = '''    const learningEvents = await service.getAdventureLearningEvents(userId, petId);\n    const stored = learningEvents.find((entry) => entry.id === receipt.careEventId);'''
          new = '''    const learningEvents = await service.getAdventureLearningEvents(userId, petId);\n    const nonFiniteLimitEvents = await service.getAdventureLearningEvents(userId, petId, Number.NaN);\n    const stored = learningEvents.find((entry) => entry.id === receipt.careEventId);'''
          if old not in text:
              raise SystemExit('missing learning integration anchor')
          text = text.replace(old, new, 1)
          old = '''    expect(stored).not.toHaveProperty('bondXp');\n    expect(\n      learningEvents.every('''
          new = '''    expect(stored).not.toHaveProperty('bondXp');\n    expect(nonFiniteLimitEvents).toEqual(learningEvents);\n    expect(\n      learningEvents.every('''
          if old not in text:
              raise SystemExit('missing non-finite assertion anchor')
          spec.write_text(text.replace(old, new, 1))
          PY

      - name: Canonicalize source changes
        run: >-
          pnpm exec prettier --write
          apps/api/src/care-events/care-events.service.ts
          apps/api/src/care-events/care-events.integration.spec.ts

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/care-events/care-events.service.ts \
            apps/api/src/care-events/care-events.integration.spec.ts
          git commit -m "Harden Adventure learning evidence limit"
          git push origin HEAD:agent/adventure-learning-signals-v2
