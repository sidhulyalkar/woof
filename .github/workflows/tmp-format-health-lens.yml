name: Temporary Health Lens formatter

on:
  push:
    branches: [agent/tmp-format-health-lens]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/health-lens-model-authority-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/api/src/health-lens/health-ai.service.ts
          apps/api/src/health-lens/health-ai.service.spec.ts
          apps/api/src/health-lens/health-lens.service.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- \
            apps/api/src/health-lens/health-ai.service.ts \
            apps/api/src/health-lens/health-ai.service.spec.ts \
            apps/api/src/health-lens/health-lens.service.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/health-lens/health-ai.service.ts \
            apps/api/src/health-lens/health-ai.service.spec.ts \
            apps/api/src/health-lens/health-lens.service.ts
          git commit -m "Format Health Lens model authority boundary"
          git push origin HEAD:agent/health-lens-model-authority-v1
