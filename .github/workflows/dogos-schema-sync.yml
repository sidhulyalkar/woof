name: dogOS schema sync

on:
  push:
    branches:
      - agent/dogos-household-core-v1
    paths:
      - .github/workflows/dogos-schema-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dogos-household-core-v1

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Add dogOS household relations to Prisma schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()

          replacements = [
              (
                  '  pets                     Pet[]\n  activities               Activity[]\n  posts                    Post[]',
                  '  pets                     Pet[]\n  activities               Activity[]\n  householdMemberships     HouseholdMember[]\n  activityHumanParticipants ActivityHumanParticipant[]\n  posts                    Post[]',
              ),
              (
                  '  devices                 Device[]\n  activities              Activity[]\n  posts                   Post[]',
                  '  devices                 Device[]\n  activities              Activity[]\n  householdMemberships    HouseholdPet[]\n  activityParticipations  ActivityPetParticipant[]\n  posts                   Post[]',
              ),
              (
                  '// ============================================\n// ACTIVITIES & FITNESS\n// ============================================\n\nmodel Activity {',
                  '''// ============================================\n// dogOS HOUSEHOLDS\n// ============================================\n\nmodel Household {\n  id        String   @id @default(uuid())\n  name      String   @default("My household")\n  timezone  String?\n  createdAt DateTime @default(now()) @map("created_at")\n  updatedAt DateTime @updatedAt @map("updated_at")\n\n  members    HouseholdMember[]\n  pets       HouseholdPet[]\n  activities Activity[]\n\n  @@map("households")\n}\n\nmodel HouseholdMember {\n  id          String   @id @default(uuid())\n  householdId String   @map("household_id")\n  userId      String   @map("user_id")\n  role        String   @default("MEMBER")\n  status      String   @default("ACTIVE")\n  joinedAt    DateTime @default(now()) @map("joined_at")\n\n  household Household @relation(fields: [householdId], references: [id], onDelete: Cascade)\n  user      User      @relation(fields: [userId], references: [id], onDelete: Cascade)\n\n  @@unique([householdId, userId])\n  @@index([userId, status])\n  @@map("household_members")\n}\n\nmodel HouseholdPet {\n  id          String   @id @default(uuid())\n  householdId String   @map("household_id")\n  petId       String   @map("pet_id")\n  status      String   @default("ACTIVE")\n  joinedAt    DateTime @default(now()) @map("joined_at")\n\n  household Household @relation(fields: [householdId], references: [id], onDelete: Cascade)\n  pet       Pet       @relation(fields: [petId], references: [id], onDelete: Cascade)\n\n  @@unique([householdId, petId])\n  @@index([petId, status])\n  @@map("household_pets")\n}\n\n// ============================================\n// ACTIVITIES & FITNESS\n// ============================================\n\nmodel Activity {''',
              ),
              (
                  '''model Activity {\n  id           String    @id @default(uuid())\n  userId       String    @map("user_id")\n  petId        String?   @map("pet_id")\n  startedAt    DateTime  @map("started_at")\n  endedAt      DateTime? @map("ended_at")\n  type         String // WALK, RUN, PLAY, HIKE\n  route        Json? // GeoJSON\n  humanMetrics Json?     @map("human_metrics") // {steps, calories, hr_avg}\n  petMetrics   Json?     @map("pet_metrics") // {distance, active_time}\n  jointMetrics Json?     @map("joint_metrics") // {sync_score}\n  createdAt    DateTime  @default(now()) @map("created_at")\n\n  user  User   @relation(fields: [userId], references: [id], onDelete: Cascade)\n  pet   Pet?   @relation(fields: [petId], references: [id], onDelete: SetNull)\n  posts Post[]\n\n  @@index([userId])\n  @@index([petId])\n  @@index([startedAt])\n  @@map("activities")\n}\n''',
                  '''model Activity {\n  id           String    @id @default(uuid())\n  userId       String    @map("user_id")\n  petId        String?   @map("pet_id")\n  householdId  String?   @map("household_id")\n  startedAt    DateTime  @map("started_at")\n  endedAt      DateTime? @map("ended_at")\n  type         String // WALK, RUN, PLAY, HIKE\n  route        Json? // GeoJSON\n  humanMetrics Json?     @map("human_metrics") // {steps, calories, hr_avg}\n  petMetrics   Json?     @map("pet_metrics") // legacy primary-pet metrics\n  jointMetrics Json?     @map("joint_metrics") // {sync_score}\n  createdAt    DateTime  @default(now()) @map("created_at")\n\n  user              User                       @relation(fields: [userId], references: [id], onDelete: Cascade)\n  pet               Pet?                       @relation(fields: [petId], references: [id], onDelete: SetNull)\n  household         Household?                 @relation(fields: [householdId], references: [id], onDelete: SetNull)\n  humanParticipants ActivityHumanParticipant[]\n  petParticipants   ActivityPetParticipant[]\n  posts             Post[]\n\n  @@index([userId])\n  @@index([petId])\n  @@index([householdId, startedAt])\n  @@index([startedAt])\n  @@map("activities")\n}\n\nmodel ActivityHumanParticipant {\n  id         String   @id @default(uuid())\n  activityId String   @map("activity_id")\n  userId     String   @map("user_id")\n  role       String   @default("PARTICIPANT")\n  createdAt  DateTime @default(now()) @map("created_at")\n\n  activity Activity @relation(fields: [activityId], references: [id], onDelete: Cascade)\n  user     User     @relation(fields: [userId], references: [id], onDelete: Cascade)\n\n  @@unique([activityId, userId])\n  @@index([userId])\n  @@map("activity_human_participants")\n}\n\nmodel ActivityPetParticipant {\n  id         String   @id @default(uuid())\n  activityId String   @map("activity_id")\n  petId      String   @map("pet_id")\n  metrics    Json?\n  createdAt  DateTime @default(now()) @map("created_at")\n\n  activity Activity @relation(fields: [activityId], references: [id], onDelete: Cascade)\n  pet      Pet      @relation(fields: [petId], references: [id], onDelete: Cascade)\n\n  @@unique([activityId, petId])\n  @@index([petId])\n  @@map("activity_pet_participants")\n}\n''',
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'Expected exactly one schema anchor, found {count}: {before[:80]!r}')
              text = text.replace(before, after, 1)

          path.write_text(text)
          PY

      - run: pnpm --filter @woof/database exec prisma format
      - run: pnpm --filter @woof/database exec prisma validate

      - name: Remove one-shot helper and commit schema
        run: |
          rm .github/workflows/dogos-schema-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma .github/workflows/dogos-schema-sync.yml
          git commit -m "feat(dogos): model households and shared activity participants"
          git push origin HEAD:agent/dogos-household-core-v1
