name: Temporary Expedition Pack Access Refactor

on:
  push:
    branches:
      - agent/expedition-authority-v1

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact Pack authority refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/social-adventure/social-adventure.service.ts')
          source = path.read_text()

          import_anchor = "import { PrismaService } from '../prisma/prisma.service';\n"
          import_line = "import { PackAccessService } from './pack-access.service';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('Prisma import anchor missing')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          access_type = """type PackAccessRow = {
            id: string;
            name: string;
            scope: string;
            visibility: string;
            memberCount: number;
            viewerJoined: boolean;
          };

          """
          source = source.replace(access_type, '', 1)

          old_constructor = '  constructor(private readonly prisma: PrismaService) {}\n'
          new_constructor = """  constructor(
            private readonly prisma: PrismaService,
            private readonly packAccess: PackAccessService
          ) {}
          """
          if old_constructor in source:
              source = source.replace(old_constructor, new_constructor, 1)
          elif 'private readonly packAccess: PackAccessService' not in source:
              raise SystemExit('SocialAdventureService constructor anchor missing')

          old_access = """    const accessRows = await this.prisma.$queryRaw<PackAccessRow[]>(Prisma.sql`
                SELECT
                  pack.id,
                  pack.name,
                  pack.scope,
                  pack.visibility,
                  COUNT(member.user_id)::int AS \"memberCount\",
                  BOOL_OR(member.user_id = ${userId} AND member.status = 'ACTIVE') AS \"viewerJoined\"
                FROM dogos_social.packs pack
                LEFT JOIN dogos_social.pack_memberships member
                  ON member.pack_id = pack.id AND member.status = 'ACTIVE'
                WHERE pack.id = ${packId}
                GROUP BY pack.id, pack.name, pack.scope, pack.visibility
              `);
              const pack = accessRows[0];
              if (!pack || (pack.visibility !== 'PUBLIC' && !pack.viewerJoined)) {
                throw new NotFoundException('Pack not found');
              }

          """
          new_access = """    const pack = await this.packAccess.requireViewable(userId, packId);

          """
          if old_access in source:
              source = source.replace(old_access, new_access, 1)
          elif 'const pack = await this.packAccess.requireViewable(userId, packId);' not in source:
              raise SystemExit('Pack leaderboard access block anchor missing')

          path.write_text(source)
          PY

      - name: Canonicalize refactored file
        run: pnpm exec prettier --write apps/api/src/social-adventure/social-adventure.service.ts

      - name: Commit only the intended refactor on latest branch head
        run: |
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Pack authority refactor already canonical.'
            exit 0
          fi
          if [[ "$changed" != 'apps/api/src/social-adventure/social-adventure.service.ts' ]]; then
            echo "Unexpected files changed:"
            echo "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/social-adventure/social-adventure.service.ts
          git commit -m 'Reuse shared Pack access authority in Social Adventure'
          git fetch origin agent/expedition-authority-v1
          git rebase origin/agent/expedition-authority-v1
          git push origin HEAD:agent/expedition-authority-v1
