name: Navigation Spine Patch Once

on:
  push:
    branches:
      - agent/navigation-spine-v1
    paths:
      - '.github/workflows/navigation-spine-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/navigation-spine-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Add contextual navigation entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path

          today = Path('apps/web/src/components/today/guardian-today-page.tsx')
          text = today.read_text()
          import_anchor = "import { PetSwitcher } from '@/components/pets/pet-switcher';\n"
          import_line = "import { RelationshipTools } from '@/components/today/relationship-tools';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('guardian Today import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          section_anchor = "            <section data-today-progress className=\"mt-7\" aria-labelledby=\"recent-rhythm-heading\">"
          tool_markup = "            <RelationshipTools />\n\n"
          if tool_markup not in text:
              if section_anchor not in text:
                  raise SystemExit('guardian Today progress anchor not found')
              text = text.replace(section_anchor, tool_markup + section_anchor, 1)
          today.write_text(text)

          community = Path('apps/web/src/app/community/page.tsx')
          text = community.read_text()
          pack_anchor = "            {hasPetContext && (\n              <Button variant=\"outline\" asChild className=\"col-span-2 bg-transparent\">\n                <Link href=\"/pack\">"
          discover_markup = """            {hasPetContext && (\n              <Button variant=\"outline\" asChild className=\"col-span-2 bg-transparent\">\n                <Link href=\"/discover\">\n                  <Globe2 className=\"mr-2 h-4 w-4\" aria-hidden=\"true\" />\n                  Discover compatible dogs & places\n                </Link>\n              </Button>\n            )}\n"""
          if discover_markup not in text:
              if pack_anchor not in text:
                  raise SystemExit('Community Pack anchor not found')
              text = text.replace(pack_anchor, discover_markup + pack_anchor, 1)
          community.write_text(text)
          PY

      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/today/guardian-today-page.tsx
          apps/web/src/app/community/page.tsx
          apps/web/src/components/today/relationship-tools.tsx
          apps/web/src/components/bottom-nav.tsx

      - name: Commit contextual navigation changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/components/today/guardian-today-page.tsx \
            apps/web/src/app/community/page.tsx \
            apps/web/src/components/today/relationship-tools.tsx \
            apps/web/src/components/bottom-nav.tsx
          if git diff --cached --quiet; then
            echo 'Navigation source already patched.'
            exit 0
          fi
          git commit -m 'feat: simplify dogOS navigation spine'
          git push origin HEAD:agent/navigation-spine-v1
